name: "APM-02: Helper - Teams Notify"

on:
  workflow_call:
    inputs:
      card_title:
        required: true
        type: string
      card_subtitle:
        required: false
        type: string
        default: ""
      status_text:
        required: true
        type: string
      status_color:
        required: true
        type: string
        # good | attention | warning | accent
      snapshot_branch:
        required: false
        type: string
        default: ""
      pr_number:
        required: false
        type: string
        default: ""
      tenant_pr_number:
        required: false
        type: string
        default: ""
      extra_fact_title:
        required: false
        type: string
        default: ""
      extra_fact_value:
        required: false
        type: string
        default: ""
      action_url:
        required: false
        type: string
        default: ""
      action_label:
        required: false
        type: string
        default: "View on GitHub"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send MS Teams Adaptive Card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
        run: |
          REPO="${{ github.repository }}"
          TITLE="${{ inputs.card_title }}"
          SUBTITLE="${{ inputs.card_subtitle }}"
          STATUS="${{ inputs.status_text }}"
          COLOR="${{ inputs.status_color }}"
          SNAPSHOT="${{ inputs.snapshot_branch }}"
          PR_NUMBER="${{ inputs.pr_number }}"
          TENANT_PR_NUMBER="${{ inputs.tenant_pr_number }}"
          EXTRA_FACT_TITLE="${{ inputs.extra_fact_title }}"
          EXTRA_FACT_VALUE="${{ inputs.extra_fact_value }}"
          ACTION_LABEL="${{ inputs.action_label }}"

          # Auto-discover PR numbers if not passed
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ] || [ "$PR_NUMBER" = "N/A" ]; then
            if [ -n "$SNAPSHOT" ]; then
              DISCOVERED_PR=$(gh pr list --repo "$REPO" -s all --base main -H "$SNAPSHOT" --json number --jq '.[0].number' 2>/dev/null || echo "")
              if [ -n "$DISCOVERED_PR" ] && [ "$DISCOVERED_PR" != "null" ]; then
                PR_NUMBER="$DISCOVERED_PR"
              fi
            fi
          fi

          if [ -z "$TENANT_PR_NUMBER" ] || [ "$TENANT_PR_NUMBER" = "null" ]; then
            if [ -n "$SNAPSHOT" ]; then
              DISCOVERED_TENANT_PR=$(gh pr list --repo "$REPO" -s all --base tenant/asint-apm-02-v2 -H "$SNAPSHOT" --json number --jq '.[0].number' 2>/dev/null || echo "")
              if [ -n "$DISCOVERED_TENANT_PR" ] && [ "$DISCOVERED_TENANT_PR" != "null" ]; then
                TENANT_PR_NUMBER="$DISCOVERED_TENANT_PR"
              fi
            fi
          fi

          # Build action URL
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ] && [ "$PR_NUMBER" != "N/A" ] && [[ "$ACTION_LABEL" =~ Review.*PR ]]; then
            ACTION_URL="https://github.com/$REPO/pull/$PR_NUMBER"
          elif [ -n "${{ inputs.action_url }}" ] && [[ ! "${{ inputs.action_url }}" =~ /pull/?$ ]]; then
            ACTION_URL="${{ inputs.action_url }}"
          elif [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ] && [ "$PR_NUMBER" != "N/A" ]; then
            ACTION_URL="https://github.com/$REPO/pull/$PR_NUMBER"
          else
            ACTION_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          fi

          # Build PR fact values
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ] && [ "$PR_NUMBER" != "N/A" ]; then
            TRACKING_PR_FACT="PR #$PR_NUMBER"
          else
            TRACKING_PR_FACT="N/A"
          fi

          if [ -n "$TENANT_PR_NUMBER" ] && [ "$TENANT_PR_NUMBER" != "null" ]; then
            TENANT_PR_FACT="PR #$TENANT_PR_NUMBER"
            TENANT_PR_URL="https://github.com/$REPO/pull/$TENANT_PR_NUMBER"
          else
            TENANT_PR_FACT=""
            TENANT_PR_URL=""
          fi

          # Determine Main PR Button Title
          if [ -n "$TRACKING_PR_FACT" ] && [ "$TRACKING_PR_FACT" != "N/A" ]; then
            MAIN_PR_BTN="Review main $TRACKING_PR_FACT"
          else
            MAIN_PR_BTN=""
          fi

          # Build facts array
          FACTS=$(jq -n \
            --arg repo "$REPO" \
            --arg snapshot "$SNAPSHOT" \
            --arg tracking_pr "$TRACKING_PR_FACT" \
            --arg tenant_pr "$TENANT_PR_FACT" \
            --arg eft "$EXTRA_FACT_TITLE" \
            --arg efv "$EXTRA_FACT_VALUE" \
            '[
              { title: "Repository",       value: $repo },
              { title: "Snapshot Branch",  value: $snapshot }
            ] +
            (if $tenant_pr != "" then [
              { title: "Main PR",          value: $tracking_pr },
              { title: "APM-02 PR",        value: $tenant_pr }
            ] else [
              { title: "Main PR",          value: $tracking_pr }
            ] end) +
            (if ($eft != "" and $efv != "") then [
              { title: $eft,               value: $efv }
            ] else [] end)')

          # Build action buttons
          ACTIONS=$(jq -n \
            --arg action_label "$ACTION_LABEL" \
            --arg action_url "$ACTION_URL" \
            --arg main_btn "$MAIN_PR_BTN" \
            --arg tenant_pr "$TENANT_PR_FACT" \
            --arg tenant_url "$TENANT_PR_URL" \
            '(
              if $main_btn != "" then [
                {
                  type: "Action.OpenUrl",
                  title: $main_btn,
                  url: $action_url
                }
              ] elif ($action_label != "" and ($action_label | test("Review.*PR") | not)) then [
                {
                  type: "Action.OpenUrl",
                  title: $action_label,
                  url: $action_url
                }
              ] else [] end
            ) +
            (if $tenant_pr != "" then [
              {
                type: "Action.OpenUrl",
                title: ("Review APM-02 " + $tenant_pr),
                url: $tenant_url
              }
            ] else [] end) +
            [
              {
                type: "Action.OpenUrl",
                title: "Track APM-02 Deployment Status in SAP CI/CD Dashboard",
                url: "https://asint-payg-development.cicd.cfapps.eu10.hana.ondemand.com/ui/index.html#/detail/AsInt-APM-02/TwoColumnsBeginExpanded"
              }
            ]')

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg subtitle "$SUBTITLE" \
            --arg status "$STATUS" \
            --arg color "$COLOR" \
            --argjson facts "$FACTS" \
            --argjson actions "$ACTIONS" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  body: (
                    [
                      {
                        type: "TextBlock",
                        size: "Large",
                        weight: "Bolder",
                        text: $title,
                        wrap: true
                      }
                    ] +
                    (if $subtitle != "" then [{
                      type: "TextBlock",
                      text: $subtitle,
                      size: "Small",
                      isSubtle: true,
                      wrap: true
                    }] else [] end) +
                    [
                      {
                        type: "ColumnSet",
                        columns: [{
                          type: "Column",
                          width: "auto",
                          items: [{
                            type: "TextBlock",
                            text: $status,
                            weight: "Bolder",
                            color: $color,
                            wrap: true
                          }]
                        }]
                      },
                      {
                        type: "FactSet",
                        facts: $facts
                      }
                    ]
                  ),
                  actions: $actions
                }
              }]
            }')

          # Send to all configured webhook URLs (same pattern as _auto_merge.yml)
          for WEBHOOK_URL in \
            "${{ secrets.TEAMS_WEBHOOK_URL_APM02 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_APM02_2 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_APM02_3 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_APM02_4 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_APM02_5 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_APM02_6 }}"; do
            if [ -n "$WEBHOOK_URL" ]; then
              curl -s -X POST \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "$WEBHOOK_URL"
            fi
          done
