name: Auto Merge

on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string
      compare:
        required: true
        type: string
      deployment_name:
        description: "Name of the deployment environment (e.g. AIS-02). Used in Teams notifications."
        required: false
        type: string
        default: ""
      dashboard_url:
        description: "URL for the SAP CI/CD Dashboard."
        required: false
        type: string
        default: "https://asint-payg-development.cicd.cfapps.eu10.hana.ondemand.com/ui/index.html#"
      cf_stop_app:
        description: "Optional CF app name to stop before merging (only if new commits exist)"
        required: false
        type: string
        default: ""
      cf_api:
        description: "CF API endpoint"
        required: false
        type: string
        default: "https://api.cf.eu10-004.hana.ondemand.com"
      cf_org:
        description: "CF Org"
        required: false
        type: string
        default: ""
      cf_space:
        description: "CF Space"
        required: false
        type: string
        default: ""
      reviewers:
        description: "Reviewers required to approve PR before merging (e.g. Daxesh-Prajapati). If set, skips immediate merge and waits for approval."
        required: false
        type: string
        default: ""
      merge_method:
        description: "Preferred merge method: 'merge' or 'squash'. If set to 'squash', only squash merging will be attempted."
        required: false
        type: string
        default: ""

jobs:
  process:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-${{ inputs.base }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Workflow Automation Scripts
        run: |
          if [ ! -f ".github/scripts/notify_auto_merge.sh" ] || [ ! -f ".github/cf-apps.json" ]; then
            echo "Automation scripts missing in checked out ref. Fetching from default branch..."
            git fetch origin dev main 2>/dev/null || true
            git checkout origin/${{ github.event.repository.default_branch || 'dev' }} -- .github/scripts .github/cf-apps.json 2>/dev/null || \
            git checkout origin/dev -- .github/scripts .github/cf-apps.json 2>/dev/null || \
            git checkout origin/main -- .github/scripts .github/cf-apps.json 2>/dev/null || true
          fi

      - name: Initialize env defaults
        run: |
          echo "pr_exists=false" >> $GITHUB_ENV
          echo "pr_created=false" >> $GITHUB_ENV
          echo "pr_mergeable=false" >> $GITHUB_ENV
          echo "pr_number=" >> $GITHUB_ENV
          echo "new_commits=false" >> $GITHUB_ENV
          echo "has_conflicts=false" >> $GITHUB_ENV
          echo "awaiting_approval=false" >> $GITHUB_ENV

      - name: Check for existing PR
        id: check-for-existing-pr
        run: |
          DEPLOY_LABEL="auto merge for ${{ inputs.deployment_name }}"
          [ -z "${{ inputs.deployment_name }}" ] && DEPLOY_LABEL="auto merge"
          PR_LIST_RESP=$(gh pr list \
            --base ${{ inputs.base }} \
            --head ${{ inputs.compare }} \
            --label "$DEPLOY_LABEL" \
            --json number)
          PR_NUMBER=$(echo "$PR_LIST_RESP" | jq -r '.[0].number')
          if [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pr_exists=true" >> $GITHUB_ENV
            echo "pr_number=$PR_NUMBER" >> $GITHUB_ENV
            echo "Existing auto merge PR found: '$PR_NUMBER'"
          else
            echo "pr_exists=false" >> $GITHUB_ENV
            echo "No existing auto merge PR, will check for new commits"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check for new commits
        id: check-for-new-commits
        if: env.pr_exists == 'false'
        run: |
          git fetch --all
          COMMITS_COUNT=$(git rev-list --count origin/${{ inputs.base }}..origin/${{ inputs.compare }})
          echo "COMMITS_COUNT: '$COMMITS_COUNT'"
          if [ "$COMMITS_COUNT" -eq 0 ]; then
            echo "No new commits found, skipping PR creation"
            echo "new_commits=false" >> $GITHUB_ENV
          else
            echo "new_commits=true" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create new PR
        id: create-pr
        if: env.pr_exists == 'false' && env.new_commits == 'true'
        run: |
          DEPLOY_LABEL="auto merge for ${{ inputs.deployment_name }}"
          [ -z "${{ inputs.deployment_name }}" ] && DEPLOY_LABEL="auto merge"

          # Ensure label exists, create if missing
          gh label create "$DEPLOY_LABEL" --color "#0075ca" --description "Automated merge PR" 2>/dev/null || true

          # Create PR without label to avoid race condition
          gh pr create \
            --base ${{ inputs.base }} \
            --head ${{ inputs.compare }} \
            --title "Merging from ${{ inputs.compare }} into ${{ inputs.base }}" \
            --body "Auto-generated PR to merge changes from \`${{ inputs.compare }}\` to \`${{ inputs.base }}\`."

          # Fetch PR number
          PR_NUMBER=$(gh pr list \
            --base ${{ inputs.base }} \
            --head ${{ inputs.compare }} \
            --json number \
            --jq '.[0].number')

          # Add label separately after PR exists
          gh pr edit "$PR_NUMBER" --add-label "$DEPLOY_LABEL"

          echo "pr_number=$PR_NUMBER" >> $GITHUB_ENV
          echo "pr_created=true" >> $GITHUB_ENV
          echo "New PR created: '$PR_NUMBER'"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check for Protected Files
        id: check-protected
        if: env.pr_exists == 'true' || env.pr_created == 'true'
        run: |
          PR_NUMBER="${{ env.pr_number }}"
          echo "Checking for protected files in PR #$PR_NUMBER..."
          CHANGED_FILES=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          if echo "$CHANGED_FILES" | grep -E '(^|/)mta\.yaml$|(^|/)xs-security\.json$'; then
            echo "protected_files_modified=true" >> $GITHUB_ENV
            gh pr comment "$PR_NUMBER" --body "⚠️ **Auto-merge blocked:** Protected files (\`mta.yaml\` or \`xs-security.json\`) were modified in this Pull Request. These files should not be overwritten in \`${{ inputs.base }}\`. Please revert these changes in the \`${{ inputs.compare }}\` branch before proceeding."
            echo "Protected files modified! Aborting merge."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Wait and check mergeability
        id: check-for-conflicts
        if: env.pr_exists == 'true' || env.pr_created == 'true'
        run: |
          PR_NUMBER="${{ env.pr_number }}"
          for i in {1..10}; do
            STATUS=$(gh pr view "$PR_NUMBER" --json mergeable --jq '.mergeable')
            echo "Attempt $i: '$STATUS'"
            if [[ "$STATUS" == "MERGEABLE" ]]; then
              echo "pr_mergeable=true" >> $GITHUB_ENV
              echo "PR '$PR_NUMBER' is mergeable"
              exit 0
            elif [[ "$STATUS" == "CONFLICTING" ]]; then
              echo "pr_mergeable=false" >> $GITHUB_ENV
              echo "has_conflicts=true" >> $GITHUB_ENV
              gh label create "conflicts detected" --color "#d93f0b" --description "PR has unresolved merge conflicts" 2>/dev/null || true
              gh pr edit "$PR_NUMBER" --add-label "conflicts detected" 2>/dev/null || true
              gh pr comment "$PR_NUMBER" --body "Auto-merge blocked: merge conflicts detected between \`${{ inputs.compare }}\` and \`${{ inputs.base }}\`. Manual resolution required."
              echo "PR '$PR_NUMBER' has conflicts — manual intervention needed"
              exit 1
            fi
            sleep 10
          done
          gh pr comment "$PR_NUMBER" --body "Auto-merge timed out waiting for mergeability status. Please check manually."
          echo "Timed out waiting for mergeability status"
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # ──────────────────────────────────────────────────────────
      # 👥 Assign Reviewer & Wait for Approval (for protected branches)
      # ──────────────────────────────────────────────────────────
      - name: Check Branch Protection & Request Review
        if: (env.pr_exists == 'true' || env.pr_created == 'true') && env.pr_mergeable == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}
          PR_NUMBER: ${{ env.pr_number }}
          INPUT_REVIEWERS: ${{ inputs.reviewers }}
          DEFAULT_REVIEWERS: "Daxesh-Prajapati, Daxesh-Prajapati2, mohnishkhoja, naimish-harkhani, Neel-Asint"
        run: |
          TARGET_BRANCH="${{ inputs.base }}"
          echo "Checking protection status for target branch: '$TARGET_BRANCH'..."
          
          IS_PROTECTED=$(gh api "repos/${{ github.repository }}/branches/$TARGET_BRANCH" --jq '.protected' 2>/dev/null || echo "false")
          echo "Branch '$TARGET_BRANCH' protected status: $IS_PROTECTED"

          ASSIGN_REVIEWERS=""
          if [ -n "$INPUT_REVIEWERS" ]; then
            ASSIGN_REVIEWERS="$INPUT_REVIEWERS"
          elif [ "$IS_PROTECTED" = "true" ]; then
            ASSIGN_REVIEWERS="$DEFAULT_REVIEWERS"
          fi

          if [ -n "$ASSIGN_REVIEWERS" ]; then
            echo "Target branch is protected. Assigning reviewers: $ASSIGN_REVIEWERS"
            IFS=',' read -ra REV_ARR <<< "$ASSIGN_REVIEWERS"
            ASSIGNED_COUNT=0
            for rev in "${REV_ARR[@]}"; do
              TRIMMED_REV=$(echo "$rev" | xargs)
              if [ -n "$TRIMMED_REV" ]; then
                echo "Requesting review from: $TRIMMED_REV"
                gh pr edit "$PR_NUMBER" --add-reviewer "$TRIMMED_REV" 2>/dev/null || true
                ASSIGNED_COUNT=$((ASSIGNED_COUNT + 1))
              fi
            done
            gh label create "awaiting approval" --color "#fbca04" --description "Awaiting required peer approval" 2>/dev/null || true
            gh pr edit "$PR_NUMBER" --add-label "awaiting approval" 2>/dev/null || true
            gh pr comment "$PR_NUMBER" --body "🟡 **Awaiting Approval:** This target branch is protected and requires review. Assigned $ASSIGN_REVIEWERS as reviewer(s). Once approved by any 1 reviewer, deployment will proceed automatically." 2>/dev/null || true
            echo "awaiting_approval=true" >> $GITHUB_ENV
            echo "assigned_reviewers=$ASSIGN_REVIEWERS" >> $GITHUB_ENV
            echo "pr_mergeable=false" >> $GITHUB_ENV
          else
            echo "Target branch is not protected or no reviewers required. Proceeding with immediate merge."
          fi

      # ──────────────────────────────────────────────────────────
      # ⚙️ Resolve CF App Configuration (from .github/cf-apps.json or inputs)
      # ──────────────────────────────────────────────────────────
      - name: Resolve CF App Configuration
        run: |
          CONFIG_FILE=".github/cf-apps.json"
          DEPLOY_NAME="${{ inputs.deployment_name }}"
          CF_API=""
          CF_ORG=""
          CF_SPACE=""
          CF_APPS_RAW=""

          if [ -f "$CONFIG_FILE" ]; then
            CF_ENV_JSON=$(jq -c --arg name "$DEPLOY_NAME" '
              def norm: ascii_downcase | gsub("[^a-z0-9]"; "");
              .environments as $envs |
              ([$envs | to_entries[] | select(
                (.key | norm) == ($name | norm) or
                ((.value.aliases // [])[] | norm) == ($name | norm)
              ) | .value] | first) // null
            ' "$CONFIG_FILE" 2>/dev/null || echo "")

            if [ -n "$CF_ENV_JSON" ] && [ "$CF_ENV_JSON" != "null" ]; then
              CF_API=$(echo "$CF_ENV_JSON" | jq -r '.api // empty')
              CF_ORG=$(echo "$CF_ENV_JSON" | jq -r '.org // empty')
              CF_SPACE=$(echo "$CF_ENV_JSON" | jq -r '.space // empty')
              CF_APPS_RAW=$(echo "$CF_ENV_JSON" | jq -r '(.apps // [])[]' 2>/dev/null || echo "")
            fi
          fi

          # Fallback to direct inputs if not found in cf-apps.json
          [ -z "$CF_API" ] && CF_API="${{ inputs.cf_api }}"
          [ -z "$CF_ORG" ] && CF_ORG="${{ inputs.cf_org }}"
          [ -z "$CF_SPACE" ] && CF_SPACE="${{ inputs.cf_space }}"
          if [ -z "$CF_APPS_RAW" ] && [ -n "${{ inputs.cf_stop_app }}" ]; then
            CF_APPS_RAW="${{ inputs.cf_stop_app }}"
          fi

          CF_APPS_COMMA=""
          CF_APPS_COUNT=0
          while IFS= read -r app; do
            TRIMMED=$(echo "$app" | xargs)
            if [ -n "$TRIMMED" ]; then
              if [ -z "$CF_APPS_COMMA" ]; then
                CF_APPS_COMMA="$TRIMMED"
              else
                CF_APPS_COMMA="$CF_APPS_COMMA, $TRIMMED"
              fi
              CF_APPS_COUNT=$((CF_APPS_COUNT + 1))
            fi
          done <<< "$CF_APPS_RAW"

          echo "cf_api=$CF_API" >> $GITHUB_ENV
          echo "cf_org=$CF_ORG" >> $GITHUB_ENV
          echo "cf_space=$CF_SPACE" >> $GITHUB_ENV
          echo "cf_apps_comma=$CF_APPS_COMMA" >> $GITHUB_ENV
          echo "cf_apps_count=$CF_APPS_COUNT" >> $GITHUB_ENV
          echo "=== RESOLVED CF CONFIGURATION ==="
          echo "Deployment: $DEPLOY_NAME"
          echo "CF API:     $CF_API"
          echo "CF Org:     $CF_ORG"
          echo "CF Space:   $CF_SPACE"
          echo "CF Apps:    $CF_APPS_COMMA (Count: $CF_APPS_COUNT)"
          echo "================================="

      # ──────────────────────────────────────────────────────────
      # 🛑 Stop App(s) Just-In-Time (COMMENTED OUT - Stopped/Started via SAP CI/CD lifecycle)
      # ──────────────────────────────────────────────────────────
      # - name: Stop App Before Merge
      #   if: env.pr_mergeable == 'true' && env.cf_apps_count != '0'
      #   env:
      #     CF_USERNAME: ${{ secrets.CF_USERNAME }}
      #     CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
      #   run: |
      #     echo "Installing CF CLI..."
      #     wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
      #     echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
      #     sudo apt-get update -qq
      #     sudo apt-get install -y cf8-cli
      #
      #     echo "Logging into Cloud Foundry..."
      #     cf login -a "$cf_api" -u "$CF_USERNAME" -p "$CF_PASSWORD"
      #     cf target -o "$cf_org" -s "$cf_space" || true
      #
      #     IFS=',' read -ra APPS_LIST <<< "$cf_apps_comma"
      #     for app in "${APPS_LIST[@]}"; do
      #       TRIMMED=$(echo "$app" | xargs)
      #       if [ -n "$TRIMMED" ]; then
      #         echo "🛑 Stopping app $TRIMMED to free memory quota for deployment..."
      #         cf stop "$TRIMMED"
      #       fi
      #     done
      #     echo "app_was_stopped=true" >> $GITHUB_ENV

      - name: Merge PR
        id: merge-pr
        if: env.pr_mergeable == 'true'
        run: |
          PR_NUMBER="${{ env.pr_number }}"
          DEPLOYING_LABEL="${{ inputs.deployment_name }} Deploying"
          [ -z "${{ inputs.deployment_name }}" ] && DEPLOYING_LABEL="Deploying"
          gh label create "$DEPLOYING_LABEL" --color "#1d76db" --description "Deployment is in progress" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "$DEPLOYING_LABEL" 2>/dev/null || true

          MERGE_METHOD="${{ inputs.merge_method }}"
          if [ "$MERGE_METHOD" = "squash" ] || [ "${{ inputs.base }}" = "tenant/asint-ais-02-dc-addin" ]; then
            echo "Squash merge requested/enforced for ${{ inputs.base }}."
            if gh pr merge "$PR_NUMBER" --squash --admin; then
              echo "Pull request '$PR_NUMBER' merged successfully using squash merge into ${{ inputs.base }}"
            elif gh pr merge "$PR_NUMBER" --squash; then
              echo "Pull request '$PR_NUMBER' merged successfully using squash merge into ${{ inputs.base }}"
            else
              gh pr comment "$PR_NUMBER" --body "Auto-merge failed during squash merge step. Please check the workflow logs."
              echo "Failed to squash merge pull request '$PR_NUMBER'"
              exit 1
            fi
          elif gh pr merge "$PR_NUMBER" --merge --admin; then
            echo "Pull request '$PR_NUMBER' merged successfully using standard merge into ${{ inputs.base }}"
          elif gh pr merge "$PR_NUMBER" --squash --admin; then
            echo "Standard merge disallowed; pull request '$PR_NUMBER' merged successfully using squash merge into ${{ inputs.base }}"
          elif gh pr merge "$PR_NUMBER" --merge; then
            echo "Pull request '$PR_NUMBER' merged successfully using standard merge into ${{ inputs.base }}"
          elif gh pr merge "$PR_NUMBER" --squash; then
            echo "Standard merge disallowed; pull request '$PR_NUMBER' merged successfully using squash merge into ${{ inputs.base }}"
          else
            gh pr comment "$PR_NUMBER" --body "Auto-merge failed during merge step (both standard and squash merge failed). Please check the workflow logs."
            echo "Failed to merge pull request '$PR_NUMBER'"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}

      # ──────────────────────────────────────────────────────────
      # 🛡️ Safety Net: Restart App(s) if Merge Fails (COMMENTED OUT)
      # ──────────────────────────────────────────────────────────
      # - name: Safety Restart App If Merge Failed
      #   if: failure() && env.app_was_stopped == 'true'
      #   env:
      #     CF_USERNAME: ${{ secrets.CF_USERNAME }}
      #     CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
      #   run: |
      #     echo "⚠️ Merge failed after app was stopped! Restarting $cf_apps_comma immediately..."
      #     cf login -a "$cf_api" -u "$CF_USERNAME" -p "$CF_PASSWORD"
      #     cf target -o "$cf_org" -s "$cf_space" || true
      #     IFS=',' read -ra APPS_LIST <<< "$cf_apps_comma"
      #     for app in "${APPS_LIST[@]}"; do
      #       TRIMMED=$(echo "$app" | xargs)
      #       if [ -n "$TRIMMED" ]; then
      #         echo "▶️ Restarting app $TRIMMED..."
      #         cf start "$TRIMMED"
      #       fi
      #     done

      # ──────────────────────────────────────────────────────────
      # ──────────────────────────────────────────────────────────
      # MS Teams Notification (Adaptive Card format)
      # Works with MS Teams "Workflows" app webhook.
      # Set TEAMS_WEBHOOK_URL secret in GitHub repo settings.
      # ──────────────────────────────────────────────────────────
      - name: Send MS Teams Notification
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}
          PR_NUMBER: ${{ env.pr_number }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ inputs.compare }}
          TARGET: ${{ inputs.base }}
          DEPLOY_NAME: ${{ inputs.deployment_name }}
          JOB_STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          AWAITING_APPROVAL: ${{ env.awaiting_approval }}
          ASSIGNED_REVIEWERS: ${{ env.assigned_reviewers }}
          INPUT_REVIEWERS: ${{ inputs.reviewers }}
          PROTECTED_FILES_MODIFIED: ${{ env.protected_files_modified }}
          HAS_CONFLICTS: ${{ env.has_conflicts }}
          APP_WAS_STOPPED: ${{ env.app_was_stopped }}
          CF_APPS_COMMA: ${{ env.cf_apps_comma }}
          DASHBOARD_URL: ${{ inputs.dashboard_url }}
          TEAMS_WEBHOOK_GLOBAL_1: ${{ secrets.TEAMS_WEBHOOK_GLOBAL_1 }}
          TEAMS_WEBHOOK_GLOBAL_2: ${{ secrets.TEAMS_WEBHOOK_GLOBAL_2 }}
          TEAMS_WEBHOOK_GLOBAL_3: ${{ secrets.TEAMS_WEBHOOK_GLOBAL_3 }}
          TEAMS_WEBHOOK_AIS02_1: ${{ secrets.TEAMS_WEBHOOK_AIS02_1 }}
          TEAMS_WEBHOOK_AIS02_2: ${{ secrets.TEAMS_WEBHOOK_AIS02_2 }}
          TEAMS_WEBHOOK_AIS02_3: ${{ secrets.TEAMS_WEBHOOK_AIS02_3 }}
          TEAMS_WEBHOOK_APM01_1: ${{ secrets.TEAMS_WEBHOOK_APM01_1 }}
          TEAMS_WEBHOOK_APM01_2: ${{ secrets.TEAMS_WEBHOOK_APM01_2 }}
          TEAMS_WEBHOOK_APM01_3: ${{ secrets.TEAMS_WEBHOOK_APM01_3 }}
          TEAMS_WEBHOOK_APM02_1: ${{ secrets.TEAMS_WEBHOOK_APM02_1 }}
          TEAMS_WEBHOOK_APM02_2: ${{ secrets.TEAMS_WEBHOOK_APM02_2 }}
          TEAMS_WEBHOOK_APM02_3: ${{ secrets.TEAMS_WEBHOOK_APM02_3 }}
          TEAMS_WEBHOOK_APMEIOT_1: ${{ secrets.TEAMS_WEBHOOK_APMEIOT_1 }}
          TEAMS_WEBHOOK_APMEIOT_2: ${{ secrets.TEAMS_WEBHOOK_APMEIOT_2 }}
          TEAMS_WEBHOOK_APMEIOT_3: ${{ secrets.TEAMS_WEBHOOK_APMEIOT_3 }}
          TEAMS_WEBHOOK_DEMO_1: ${{ secrets.TEAMS_WEBHOOK_DEMO_1 }}
          TEAMS_WEBHOOK_DEMO_2: ${{ secrets.TEAMS_WEBHOOK_DEMO_2 }}
          TEAMS_WEBHOOK_DEMO_3: ${{ secrets.TEAMS_WEBHOOK_DEMO_3 }}
          TEAMS_WEBHOOK_BAYSTAR_1: ${{ secrets.TEAMS_WEBHOOK_BAYSTAR_1 }}
          TEAMS_WEBHOOK_BAYSTAR_2: ${{ secrets.TEAMS_WEBHOOK_BAYSTAR_2 }}
          TEAMS_WEBHOOK_BAYSTAR_3: ${{ secrets.TEAMS_WEBHOOK_BAYSTAR_3 }}
          TEAMS_WEBHOOK_HSC_NON_PROD_1: ${{ secrets.TEAMS_WEBHOOK_HSC_NON_PROD_1 }}
          TEAMS_WEBHOOK_HSC_NON_PROD_2: ${{ secrets.TEAMS_WEBHOOK_HSC_NON_PROD_2 }}
          TEAMS_WEBHOOK_HSC_NON_PROD_3: ${{ secrets.TEAMS_WEBHOOK_HSC_NON_PROD_3 }}
          TEAMS_WEBHOOK_HSC_PROD_1: ${{ secrets.TEAMS_WEBHOOK_HSC_PROD_1 }}
          TEAMS_WEBHOOK_HSC_PROD_2: ${{ secrets.TEAMS_WEBHOOK_HSC_PROD_2 }}
          TEAMS_WEBHOOK_HSC_PROD_3: ${{ secrets.TEAMS_WEBHOOK_HSC_PROD_3 }}
          TEAMS_WEBHOOK_INDORAMA_PROD_900_1: ${{ secrets.TEAMS_WEBHOOK_INDORAMA_PROD_900_1 }}
          TEAMS_WEBHOOK_INDORAMA_PROD_900_2: ${{ secrets.TEAMS_WEBHOOK_INDORAMA_PROD_900_2 }}
          TEAMS_WEBHOOK_INDORAMA_PROD_900_3: ${{ secrets.TEAMS_WEBHOOK_INDORAMA_PROD_900_3 }}
          TEAMS_WEBHOOK_INDORAMA_PROD_933_1: ${{ secrets.TEAMS_WEBHOOK_INDORAMA_PROD_933_1 }}
          TEAMS_WEBHOOK_INDORAMA_PROD_933_2: ${{ secrets.TEAMS_WEBHOOK_INDORAMA_PROD_933_2 }}
          TEAMS_WEBHOOK_INDORAMA_PROD_933_3: ${{ secrets.TEAMS_WEBHOOK_INDORAMA_PROD_933_3 }}
          TEAMS_WEBHOOK_INDORAMA_QA_233_1: ${{ secrets.TEAMS_WEBHOOK_INDORAMA_QA_233_1 }}
          TEAMS_WEBHOOK_INDORAMA_QA_233_2: ${{ secrets.TEAMS_WEBHOOK_INDORAMA_QA_233_2 }}
          TEAMS_WEBHOOK_INDORAMA_QA_233_3: ${{ secrets.TEAMS_WEBHOOK_INDORAMA_QA_233_3 }}
          TEAMS_WEBHOOK_INDORAMA_QA_234_1: ${{ secrets.TEAMS_WEBHOOK_INDORAMA_QA_234_1 }}
          TEAMS_WEBHOOK_INDORAMA_QA_234_2: ${{ secrets.TEAMS_WEBHOOK_INDORAMA_QA_234_2 }}
          TEAMS_WEBHOOK_INDORAMA_QA_234_3: ${{ secrets.TEAMS_WEBHOOK_INDORAMA_QA_234_3 }}
          TEAMS_WEBHOOK_IRC_1: ${{ secrets.TEAMS_WEBHOOK_IRC_1 }}
          TEAMS_WEBHOOK_IRC_2: ${{ secrets.TEAMS_WEBHOOK_IRC_2 }}
          TEAMS_WEBHOOK_IRC_3: ${{ secrets.TEAMS_WEBHOOK_IRC_3 }}
          TEAMS_WEBHOOK_ST_ENV_1: ${{ secrets.TEAMS_WEBHOOK_ST_ENV_1 }}
          TEAMS_WEBHOOK_ST_ENV_2: ${{ secrets.TEAMS_WEBHOOK_ST_ENV_2 }}
          TEAMS_WEBHOOK_ST_ENV_3: ${{ secrets.TEAMS_WEBHOOK_ST_ENV_3 }}
          TEAMS_WEBHOOK_VMOS_1: ${{ secrets.TEAMS_WEBHOOK_VMOS_1 }}
          TEAMS_WEBHOOK_VMOS_2: ${{ secrets.TEAMS_WEBHOOK_VMOS_2 }}
          TEAMS_WEBHOOK_VMOS_3: ${{ secrets.TEAMS_WEBHOOK_VMOS_3 }}
          TEAMS_WEBHOOK_AIS02_DC_1: ${{ secrets.TEAMS_WEBHOOK_AIS02_DC_1 }}
