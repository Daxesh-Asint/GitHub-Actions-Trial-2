name: Auto Merge

on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string
      compare:
        required: true
        type: string
      deployment_name:
        description: "Name of the deployment environment (e.g. AIS-02). Used in Teams notifications."
        required: false
        type: string
        default: ""
      dashboard_url:
        description: "URL for the SAP CI/CD Dashboard."
        required: false
        type: string
        default: "https://asint-payg-development.cicd.cfapps.eu10.hana.ondemand.com/ui/index.html#"
      cf_stop_app:
        description: "Optional CF app name to stop before merging (only if new commits exist)"
        required: false
        type: string
        default: ""
      cf_api:
        description: "CF API endpoint"
        required: false
        type: string
        default: "https://api.cf.eu10-004.hana.ondemand.com"
      cf_org:
        description: "CF Org"
        required: false
        type: string
        default: ""
      cf_space:
        description: "CF Space"
        required: false
        type: string
        default: ""
      reviewers:
        description: "Reviewers required to approve PR before merging (e.g. Daxesh-Prajapati). If set, skips immediate merge and waits for approval."
        required: false
        type: string
        default: ""

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.compare }}
          fetch-depth: 0

      - name: Initialize env defaults
        run: |
          echo "pr_exists=false" >> $GITHUB_ENV
          echo "pr_created=false" >> $GITHUB_ENV
          echo "pr_mergeable=false" >> $GITHUB_ENV
          echo "pr_number=" >> $GITHUB_ENV
          echo "new_commits=false" >> $GITHUB_ENV
          echo "has_conflicts=false" >> $GITHUB_ENV
          echo "awaiting_approval=false" >> $GITHUB_ENV

      - name: Check for existing PR
        id: check-for-existing-pr
        run: |
          DEPLOY_LABEL="auto merge for ${{ inputs.deployment_name }}"
          [ -z "${{ inputs.deployment_name }}" ] && DEPLOY_LABEL="auto merge"
          PR_LIST_RESP=$(gh pr list \
            --base ${{ inputs.base }} \
            --head ${{ inputs.compare }} \
            --label "$DEPLOY_LABEL" \
            --json number)
          PR_NUMBER=$(echo "$PR_LIST_RESP" | jq -r '.[0].number')
          if [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pr_exists=true" >> $GITHUB_ENV
            echo "pr_number=$PR_NUMBER" >> $GITHUB_ENV
            echo "Existing auto merge PR found: '$PR_NUMBER'"
          else
            echo "pr_exists=false" >> $GITHUB_ENV
            echo "No existing auto merge PR, will check for new commits"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check for new commits
        id: check-for-new-commits
        if: env.pr_exists == 'false'
        run: |
          git fetch --all
          COMMITS_COUNT=$(git rev-list --count origin/${{ inputs.base }}..origin/${{ inputs.compare }})
          echo "COMMITS_COUNT: '$COMMITS_COUNT'"
          if [ "$COMMITS_COUNT" -eq 0 ]; then
            echo "No new commits found, skipping PR creation"
            echo "new_commits=false" >> $GITHUB_ENV
          else
            echo "new_commits=true" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create new PR
        id: create-pr
        if: env.pr_exists == 'false' && env.new_commits == 'true'
        run: |
          DEPLOY_LABEL="auto merge for ${{ inputs.deployment_name }}"
          [ -z "${{ inputs.deployment_name }}" ] && DEPLOY_LABEL="auto merge"

          # Ensure label exists, create if missing
          gh label create "$DEPLOY_LABEL" --color "#0075ca" --description "Automated merge PR" 2>/dev/null || true

          # Create PR without label to avoid race condition
          gh pr create \
            --base ${{ inputs.base }} \
            --head ${{ inputs.compare }} \
            --title "Merging from ${{ inputs.compare }} into ${{ inputs.base }}" \
            --body "Auto-generated PR to merge changes from \`${{ inputs.compare }}\` to \`${{ inputs.base }}\`."

          # Fetch PR number
          PR_NUMBER=$(gh pr list \
            --base ${{ inputs.base }} \
            --head ${{ inputs.compare }} \
            --json number \
            --jq '.[0].number')

          # Add label separately after PR exists
          gh pr edit "$PR_NUMBER" --add-label "$DEPLOY_LABEL"

          echo "pr_number=$PR_NUMBER" >> $GITHUB_ENV
          echo "pr_created=true" >> $GITHUB_ENV
          echo "New PR created: '$PR_NUMBER'"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check for Protected Files
        id: check-protected
        if: env.pr_exists == 'true' || env.pr_created == 'true'
        run: |
          PR_NUMBER="${{ env.pr_number }}"
          echo "Checking for protected files in PR #$PR_NUMBER..."
          CHANGED_FILES=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          if echo "$CHANGED_FILES" | grep -E '(^|/)mta\.yaml$|(^|/)xs-security\.json$'; then
            echo "protected_files_modified=true" >> $GITHUB_ENV
            gh pr comment "$PR_NUMBER" --body "⚠️ **Auto-merge blocked:** Protected files (\`mta.yaml\` or \`xs-security.json\`) were modified in this Pull Request. These files should not be overwritten in \`${{ inputs.base }}\`. Please revert these changes in the \`${{ inputs.compare }}\` branch before proceeding."
            echo "Protected files modified! Aborting merge."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Wait and check mergeability
        id: check-for-conflicts
        if: env.pr_exists == 'true' || env.pr_created == 'true'
        run: |
          PR_NUMBER="${{ env.pr_number }}"
          for i in {1..10}; do
            STATUS=$(gh pr view "$PR_NUMBER" --json mergeable --jq '.mergeable')
            echo "Attempt $i: '$STATUS'"
            if [[ "$STATUS" == "MERGEABLE" ]]; then
              echo "pr_mergeable=true" >> $GITHUB_ENV
              echo "PR '$PR_NUMBER' is mergeable"
              exit 0
            elif [[ "$STATUS" == "CONFLICTING" ]]; then
              echo "pr_mergeable=false" >> $GITHUB_ENV
              echo "has_conflicts=true" >> $GITHUB_ENV
              gh label create "conflicts detected" --color "#d93f0b" --description "PR has unresolved merge conflicts" 2>/dev/null || true
              gh pr edit "$PR_NUMBER" --add-label "conflicts detected" 2>/dev/null || true
              gh pr comment "$PR_NUMBER" --body "Auto-merge blocked: merge conflicts detected between \`${{ inputs.compare }}\` and \`${{ inputs.base }}\`. Manual resolution required."
              echo "PR '$PR_NUMBER' has conflicts — manual intervention needed"
              exit 1
            fi
            sleep 10
          done
          gh pr comment "$PR_NUMBER" --body "Auto-merge timed out waiting for mergeability status. Please check manually."
          echo "Timed out waiting for mergeability status"
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # ──────────────────────────────────────────────────────────
      # 👥 Assign Reviewer & Wait for Approval (for protected branches)
      # ──────────────────────────────────────────────────────────
      - name: Request Review for Protected Branch
        if: (env.pr_exists == 'true' || env.pr_created == 'true') && inputs.reviewers != '' && env.pr_mergeable == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ env.pr_number }}
        run: |
          echo "Protected branch requires review from: ${{ inputs.reviewers }}"
          IFS=',' read -ra REV_ARR <<< "${{ inputs.reviewers }}"
          for rev in "${REV_ARR[@]}"; do
            TRIMMED_REV=$(echo "$rev" | xargs)
            if [ -n "$TRIMMED_REV" ]; then
              echo "Requesting review from: $TRIMMED_REV"
              gh pr edit "$PR_NUMBER" --add-reviewer "$TRIMMED_REV" 2>/dev/null || true
            fi
          done
          gh label create "awaiting approval" --color "#fbca04" --description "Awaiting required peer approval" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "awaiting approval" 2>/dev/null || true
          gh pr comment "$PR_NUMBER" --body "🟡 **Awaiting Approval:** This target branch is protected and requires review. Assigned ${{ inputs.reviewers }} as reviewer(s). Once approved by any 1 reviewer, deployment will proceed automatically." 2>/dev/null || true
          echo "awaiting_approval=true" >> $GITHUB_ENV
          echo "pr_mergeable=false" >> $GITHUB_ENV

      # ──────────────────────────────────────────────────────────
      # 🛑 Stop App Just-In-Time (ONLY if PR is mergeable and ready to merge)
      # ──────────────────────────────────────────────────────────
      - name: Stop App Before Merge
        if: env.pr_mergeable == 'true' && inputs.cf_stop_app != ''
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          echo "Installing CF CLI..."
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update -qq
          sudo apt-get install -y cf8-cli

          echo "Logging into Cloud Foundry..."
          cf login -a "${{ inputs.cf_api }}" -u "$CF_USERNAME" -p "$CF_PASSWORD"
          cf target -o "${{ inputs.cf_org }}" -s "${{ inputs.cf_space }}" || cf target -o "0f54752b-a45b-49e0-9426-27cc38ee2dec" -s "${{ inputs.cf_space }}" || cf target -o "d3189c73-7adc-4cc0-afa6-22d3ac41bd9e" -s "${{ inputs.cf_space }}" || true

          echo "🛑 Stopping app ${{ inputs.cf_stop_app }} to free memory quota for deployment..."
          cf stop "${{ inputs.cf_stop_app }}"
          echo "app_was_stopped=true" >> $GITHUB_ENV

      - name: Merge PR
        id: merge-pr
        if: env.pr_mergeable == 'true'
        run: |
          PR_NUMBER="${{ env.pr_number }}"
          if gh pr merge "$PR_NUMBER" --merge; then
            echo "Pull request '$PR_NUMBER' merged successfully"
          else
            gh pr comment "$PR_NUMBER" --body "Auto-merge failed during merge step. Please check the workflow logs."
            echo "Failed to merge pull request '$PR_NUMBER'"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # ──────────────────────────────────────────────────────────
      # 🛡️ Safety Net: Restart App if Merge Fails
      # ──────────────────────────────────────────────────────────
      - name: Safety Restart App If Merge Failed
        if: failure() && env.app_was_stopped == 'true'
        env:
          CF_USERNAME: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
        run: |
          echo "⚠️ Merge failed after app was stopped! Restarting ${{ inputs.cf_stop_app }} immediately..."
          cf login -a "${{ inputs.cf_api }}" -u "$CF_USERNAME" -p "$CF_PASSWORD"
          cf target -o "${{ inputs.cf_org }}" -s "${{ inputs.cf_space }}" || cf target -o "0f54752b-a45b-49e0-9426-27cc38ee2dec" -s "${{ inputs.cf_space }}" || cf target -o "d3189c73-7adc-4cc0-afa6-22d3ac41bd9e" -s "${{ inputs.cf_space }}" || true
          cf start "${{ inputs.cf_stop_app }}"

      # ──────────────────────────────────────────────────────────
      # MS Teams Notification (Adaptive Card format)
      # Works with MS Teams "Workflows" app webhook.
      # Set TEAMS_WEBHOOK_URL secret in GitHub repo settings.
      # ──────────────────────────────────────────────────────────
      - name: Send MS Teams Notification
        if: always()
        run: |
          PR_NUMBER="${{ env.pr_number }}"
          REPO="${{ github.repository }}"
          SOURCE="${{ inputs.compare }}"
          TARGET="${{ inputs.base }}"
          DEPLOY_NAME="${{ inputs.deployment_name }}"

          # Fetch list of unique authors and commit count
          COMMIT_COUNT="0"
          MERGE_COMMIT_ID="N/A"
          if [ -n "$PR_NUMBER" ]; then
            AUTHORS=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/commits --paginate --jq '[.[] | if .author.login then .author.login else .commit.author.name end] | unique | if length > 3 then (.[0:3] + ["and \(length - 3) others"]) else . end | join(", ")' 2>/dev/null)
            COMMIT_COUNT=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/commits --paginate --jq 'length' 2>/dev/null)
            
            # Fetch the resulting merge commit ID (shortened to 7 characters)
            if [ "${{ job.status }}" = "success" ]; then
              MERGE_COMMIT_ID=$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid // empty' 2>/dev/null | cut -c 1-7)
              [ -z "$MERGE_COMMIT_ID" ] && MERGE_COMMIT_ID="N/A"
            fi
          fi
          
          if [ -z "$AUTHORS" ]; then
            AUTHORS="${{ github.actor }}"
          fi

          # Check if at least one webhook URL is set
          if [ -z "${{ secrets.TEAMS_WEBHOOK_URL_AIS02 }}" ] && [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ] && [ -z "${{ secrets.TEAMS_WEBHOOK_URL_2 }}" ] && [ -z "${{ secrets.TEAMS_WEBHOOK_URL_3 }}" ]; then
            echo "No Teams webhook secrets are set, skipping notification."
            exit 0
          fi

          # Determine merge status and card title
          if [ "${{ job.status }}" = "success" ]; then
            if [ -z "$PR_NUMBER" ]; then
              MERGE_STATUS="🔄 Already Up to Date"
              MERGE_COLOR="good"
              if [ -n "$DEPLOY_NAME" ]; then
                CARD_TITLE="✅ $DEPLOY_NAME Sync: Up to Date"
              else
                CARD_TITLE="Sync Status: Up to Date"
              fi
              CARD_SUBTITLE="No new commits to merge from $SOURCE to $TARGET"
              PR_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              PR_LABEL="View Run on GitHub"
              PR_FACT_VAL="None Required"
            elif [ "${{ env.awaiting_approval }}" = "true" ]; then
              MERGE_STATUS="⏳ Waiting for Approval"
              MERGE_COLOR="warning"
              if [ -n "$DEPLOY_NAME" ]; then
                CARD_TITLE="🟡 $DEPLOY_NAME: Awaiting Review & Approval"
              else
                CARD_TITLE="🟡 Awaiting Review & Approval"
              fi
              CARD_SUBTITLE="Target branch is protected. Assigned ${{ inputs.reviewers }} as reviewer. Once approved, deployment will start automatically."
              PR_URL="https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
              PR_LABEL="Review & Approve PR on GitHub"
              if [ -n "$COMMIT_COUNT" ] && [ "$COMMIT_COUNT" -gt 0 ] 2>/dev/null; then
                PR_FACT_VAL="PR #$PR_NUMBER ($COMMIT_COUNT commits)"
              else
                PR_FACT_VAL="PR #$PR_NUMBER"
              fi
            else
              MERGE_STATUS="✅ Merged Successfully"
              MERGE_COLOR="good"
              if [ -n "$DEPLOY_NAME" ]; then
                CARD_TITLE="🚀 $DEPLOY_NAME Deployment Triggered"
                if [ -n "${{ inputs.cf_stop_app }}" ]; then
                  CARD_SUBTITLE="Auto-merge completed • Stopped ${{ inputs.cf_stop_app }} (freed CF runtime memory) • SAP CI/CD started"
                else
                  CARD_SUBTITLE="Auto-merge completed • SAP CI/CD deployment started"
                fi
              else
                CARD_TITLE="GitHub Auto-Merge Notification"
                CARD_SUBTITLE=""
              fi
              PR_URL="https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
              PR_LABEL="View PR on GitHub"
              if [ -n "$COMMIT_COUNT" ] && [ "$COMMIT_COUNT" -gt 0 ] 2>/dev/null; then
                PR_FACT_VAL="PR #$PR_NUMBER ($COMMIT_COUNT commits)"
              else
                PR_FACT_VAL="PR #$PR_NUMBER"
              fi
            fi
          else
            # Check the specific reason for failure
            if [ "${{ env.protected_files_modified }}" = "true" ]; then
              MERGE_STATUS="🚫 Protected Files Modified"
              MERGE_COLOR="attention"
              if [ -n "$DEPLOY_NAME" ]; then
                CARD_TITLE="🚫 $DEPLOY_NAME Deployment Blocked — Protected Files"
                CARD_SUBTITLE="mta.yaml or xs-security.json were modified. Please revert these changes before merging."
              else
                CARD_TITLE="🚫 Auto-Merge Blocked — Protected Files"
                CARD_SUBTITLE="mta.yaml or xs-security.json were modified. Please revert these changes."
              fi
            elif [ "${{ env.has_conflicts }}" = "true" ]; then
              MERGE_STATUS="⚠️ Merge Conflicts Detected"
              MERGE_COLOR="attention"
              if [ -n "$DEPLOY_NAME" ]; then
                CARD_TITLE="⚠️ $DEPLOY_NAME Deployment Blocked — Merge Conflicts"
                CARD_SUBTITLE="Merge conflicts detected between $SOURCE and $TARGET. Manual resolution required before deployment can proceed."
              else
                CARD_TITLE="⚠️ Auto-Merge Blocked — Merge Conflicts"
                CARD_SUBTITLE="Merge conflicts detected between $SOURCE and $TARGET. Manual resolution required."
              fi
            else
              MERGE_STATUS="❌ Failed / Blocked"
              MERGE_COLOR="attention"
              if [ -n "$DEPLOY_NAME" ]; then
                CARD_TITLE="❌ $DEPLOY_NAME Deployment Failed"
                CARD_SUBTITLE="Auto-merge workflow failed. Please check the workflow logs."
              else
                CARD_TITLE="GitHub Auto-Merge Notification"
                CARD_SUBTITLE=""
              fi
            fi
            if [ -n "$PR_NUMBER" ]; then
              PR_URL="https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
              PR_LABEL="View PR on GitHub"
              if [ -n "$COMMIT_COUNT" ] && [ "$COMMIT_COUNT" -gt 0 ] 2>/dev/null; then
                PR_FACT_VAL="PR #$PR_NUMBER ($COMMIT_COUNT commits)"
              else
                PR_FACT_VAL="PR #$PR_NUMBER"
              fi
            else
              PR_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              PR_LABEL="View Run on GitHub"
              PR_FACT_VAL="N/A"
            fi
          fi

          CF_APP_NOTE=""
          if [ -n "${{ inputs.cf_stop_app }}" ]; then
            if [ "${{ env.app_was_stopped }}" = "true" ] && [ "${{ env.pr_mergeable }}" != "true" ]; then
              CF_APP_NOTE="▶️ Restarting ${{ inputs.cf_stop_app }} (Deployment merge failed; restoring runtime services)"
            else
              CF_APP_NOTE="🛑 Stopped ${{ inputs.cf_stop_app }} — Stopped because more Cloud Foundry runtime memory is needed to get deployment completed."
            fi
          fi

          DASHBOARD_URL="${{ inputs.dashboard_url }}"
          DASHBOARD_TITLE="Track Deployment in SAP CI/CD Dashboard"
          if [ -n "$DEPLOY_NAME" ]; then
            DASHBOARD_TITLE="Track $DEPLOY_NAME Deployment in SAP CI/CD Dashboard"
          fi

          # Build Adaptive Card JSON using jq to avoid escaping and syntax issues
          PAYLOAD=$(jq -n \
            --arg title "$CARD_TITLE" \
            --arg status "$MERGE_STATUS" \
            --arg color "$MERGE_COLOR" \
            --arg repo "$REPO" \
            --arg pr "$PR_FACT_VAL" \
            --arg source "$SOURCE" \
            --arg target "$TARGET" \
            --arg merge_commit "$MERGE_COMMIT_ID" \
            --arg authors "$AUTHORS" \
            --arg pr_url "$PR_URL" \
            --arg pr_label "$PR_LABEL" \
            --arg subtitle "$CARD_SUBTITLE" \
            --arg dashboard_url "$DASHBOARD_URL" \
            --arg dashboard_title "$DASHBOARD_TITLE" \
            --arg cf_app_note "$CF_APP_NOTE" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  body: (
                    [
                      {
                        type: "TextBlock",
                        size: "Large",
                        weight: "Bolder",
                        text: $title,
                        wrap: true
                      }
                    ] +
                    (if $subtitle != "" then [
                      {
                        type: "TextBlock",
                        text: $subtitle,
                        size: "Small",
                        isSubtle: true,
                        wrap: true
                      }
                    ] else [] end) +
                    [
                      {
                        type: "ColumnSet",
                        columns: [
                          {
                            type: "Column",
                            width: "auto",
                            items: [{
                              type: "TextBlock",
                              text: $status,
                              weight: "Bolder",
                              color: $color
                            }]
                          }
                        ]
                      },
                      {
                        type: "FactSet",
                        facts: (
                          [
                            { title: "Repository", value: $repo },
                            { title: "Changes By", value: $authors },
                            { title: "Pull Request", value: $pr },
                            { title: "Source Branch", value: $source },
                            { title: "Target Branch", value: $target },
                            { title: "CI/CD Commit ID", value: $merge_commit }
                          ] +
                          (if $cf_app_note != "" then [
                            { title: "CF App Control", value: $cf_app_note }
                          ] else [] end)
                        )
                      }
                    ]
                  ),
                  actions: (
                    [
                      {
                        type: "Action.OpenUrl",
                        title: $pr_label,
                        url: $pr_url
                      }
                    ] +
                    (if $dashboard_url != "" then [
                      {
                        type: "Action.OpenUrl",
                        title: $dashboard_title,
                        url: $dashboard_url
                      }
                    ] else [] end)
                  )
                }
              }]
            }')

          # Send to all MS Teams webhooks
          for WEBHOOK_URL in \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_2 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_3 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_2 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_3 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_4 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_5 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_6 }}"; do
            if [ -n "$WEBHOOK_URL" ]; then
              curl -s -X POST \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "$WEBHOOK_URL"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}
