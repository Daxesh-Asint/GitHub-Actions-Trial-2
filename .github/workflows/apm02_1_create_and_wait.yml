name: "[1] APM-02 Snapshot Deployment"

on:
  workflow_dispatch:
    inputs:
      waiting_minutes:
        description: "Waiting window for developers to cherry-pick (minutes)"
        required: true
        default: "30"
        type: choice
        options:
          - "10"
          - "15"
          - "20"
          - "25"
          - "30"
          - "35"
          - "40"
          - "45"
          - "50"
          - "55"
          - "60"

jobs:
  # ─────────────────────────────────────────────
  # STEP 1 — Guard: block if active snapshot exists
  # ─────────────────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for active snapshot
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTIVE_PR=$(gh pr list --repo ${{ github.repository }} --state open --label "APM-02 Active" --json number --jq '.[0].number')
          DEPLOYING_PR=$(gh pr list --repo ${{ github.repository }} --state open --label "APM-02 Deploying" --json number --jq '.[0].number')
          
          if [ -n "$ACTIVE_PR" ] || [ -n "$DEPLOYING_PR" ]; then
            echo "❌ ERROR: Active deployment exists (PR #$ACTIVE_PR$DEPLOYING_PR). Complete or close it before starting a new one."
            exit 1
          fi
          echo "✅ State is IDLE. Proceeding."

  # (Removed set-active step because create-snapshot will create the release tag)

  # ─────────────────────────────────────────────
  # STEP 3 — Create snapshot branch from main
  # ─────────────────────────────────────────────
  create-snapshot:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      snapshot_branch: ${{ steps.create.outputs.snapshot_branch }}
      date_ist: ${{ steps.create.outputs.date_ist }}
      time_ist: ${{ steps.create.outputs.time_ist }}
      deploy_time_ist: ${{ steps.create.outputs.deploy_time_ist }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create snapshot branch
        id: create
        run: |
          SNAPSHOT_NAME="snapshot/main-$(TZ='Asia/Kolkata' date +'%y%m%d-%H%M')"
          DATE_IST=$(TZ='Asia/Kolkata' date +'%a, %b %d %Y')
          TIME_IST=$(TZ='Asia/Kolkata' date +'%I:%M %p IST')
          DEPLOY_TIME_IST=$(TZ='Asia/Kolkata' date -d "+${{ inputs.waiting_minutes }} minutes" +'%I:%M %p IST')

          echo "snapshot_branch=$SNAPSHOT_NAME" >> $GITHUB_OUTPUT
          echo "date_ist=$DATE_IST" >> $GITHUB_OUTPUT
          echo "time_ist=$TIME_IST" >> $GITHUB_OUTPUT
          echo "deploy_time_ist=$DEPLOY_TIME_IST" >> $GITHUB_OUTPUT

          git checkout -b "$SNAPSHOT_NAME"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: initiate APM-02 snapshot tracking"
          
          git push origin "$SNAPSHOT_NAME"
          echo "✅ Snapshot branch '$SNAPSHOT_NAME' created from main"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create Tracking Pull Request
        run: |
          SNAPSHOT="${{ steps.create.outputs.snapshot_branch }}"
          DATE_IST="${{ steps.create.outputs.date_ist }}"
          TIME_IST="${{ steps.create.outputs.time_ist }}"
          DEPLOY_TIME_IST="${{ steps.create.outputs.deploy_time_ist }}"
          INITIATED_BY="${{ github.actor }}"

          gh label create "APM-02 Active" --color "#0E8A16" --description "APM-02 Snapshot is active and accepting cherry-picks" --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "APM-02 Deploying" --color "#1D76DB" --description "APM-02 is deploying to SAP CI/CD" --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "APM-02 Failed" --color "#B60205" --description "APM-02 deployment failed" --repo ${{ github.repository }} 2>/dev/null || true
          gh label create "APM-02 Blocked" --color "#D93F0B" --description "APM-02 blocked by conflicts" --repo ${{ github.repository }} 2>/dev/null || true

          PR_BODY=$(printf '%s\n' \
            "**Active Snapshot:** \`$SNAPSHOT\`" \
            "" \
            "**Started:** $DATE_IST at $TIME_IST" \
            "**Initiated by:** $INITIATED_BY" \
            "**Waiting window:** ${{ inputs.waiting_minutes }} minutes (Deployment automatically starts at $DEPLOY_TIME_IST)" \
            "" \
            "> Developers: cherry-pick your changes into this branch before the deployment begins." \
            "> Do NOT commit directly to \`main\` or \`tenant/asint-apm-02\`.")

          gh pr create --repo ${{ github.repository }} \
            --base main \
            --head "$SNAPSHOT" \
            --title "🟢 APM-02 Active Snapshot: $SNAPSHOT" \
            --body "$PR_BODY" \
            --draft \
            --label "APM-02 Active"
          echo "✅ Tracking PR created and labeled"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────
  # STEP 4 — Notify developers in Teams
  # ─────────────────────────────────────────────
  notify-developers:
    needs: create-snapshot
    uses: ./.github/workflows/_apm02_notify.yml
    with:
      card_title: "🌿 New Snapshot Branch Created For APM02 Deployment"
      card_subtitle: "A new deployment snapshot has been created from main. Please cherry-pick your required changes into this snapshot branch before the deployment begins."
      status_text: "⏳ Waiting for Cherry-picks (${{ inputs.waiting_minutes }} minutes until ${{ needs.create-snapshot.outputs.deploy_time_ist }})"
      status_color: "accent"
      snapshot_branch: ${{ needs.create-snapshot.outputs.snapshot_branch }}
      extra_fact_title: "Deployment Schedule"
      extra_fact_value: "The waiting window closes in ${{ inputs.waiting_minutes }} minutes. APM-02 deployment will start automatically at ${{ needs.create-snapshot.outputs.deploy_time_ist }}."
      action_label: "View Snapshot Branch"
      action_url: "https://github.com/${{ github.repository }}/tree/${{ needs.create-snapshot.outputs.snapshot_branch }}"
    secrets: inherit

  # ─────────────────────────────────────────────
  # STEP 5 — Wait (waiting_minutes minus 5)
  # ─────────────────────────────────────────────
  wait-main:
    needs: [create-snapshot, notify-developers]
    runs-on: ubuntu-latest
    steps:
      - name: Wait for developers to cherry-pick
        run: |
          echo "⏳ Waiting for developers to cherry-pick. Polling Tracking PR for target time..."
          
          while true; do
            ACTIVE_PR=$(gh pr list --repo ${{ github.repository }} --state open --label "APM-02 Active" --json number --jq '.[0].number')
            TARGET_TIME_IST=$(gh pr view "$ACTIVE_PR" --repo ${{ github.repository }} --json body --jq '.body' | grep -oP 'starts at \K.*?(?=\))')
            TIME_STR=$(echo "$TARGET_TIME_IST" | sed 's/ IST//')
            
            TARGET_TS=$(TZ='Asia/Kolkata' date -d "$TIME_STR" +%s)
            NOW_TS=$(TZ='Asia/Kolkata' date +%s)
            
            DIFF=$((TARGET_TS - NOW_TS))
            
            if [ "$DIFF" -le 300 ]; then
              echo "✅ Less than 5 minutes remaining. Main wait complete."
              break
            fi
            
            echo "⏳ $DIFF seconds remaining until deployment. Sleeping for 30s..."
            sleep 30
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────
  # STEP 6 — Send 5-minute reminder
  # ─────────────────────────────────────────────
  notify-reminder:
    needs: [create-snapshot, wait-main]
    uses: ./.github/workflows/_apm02_notify.yml
    with:
      card_title: "⏰ APM-02 Deployment Starting in 5 Minutes"
      card_subtitle: "The waiting window is almost over. If you still need more time for cherry-picking, please inform DevOps immediately to extend the window."
      status_text: "⚠️ Starting in 5 minutes at ${{ needs.create-snapshot.outputs.deploy_time_ist }}"
      status_color: "warning"
      snapshot_branch: ${{ needs.create-snapshot.outputs.snapshot_branch }}
      extra_fact_title: "Need More Time?"
      extra_fact_value: "Ask DevOps to trigger the 'APM-02 Extend Waiting Window' workflow now."
      action_label: "View Snapshot Branch"
      action_url: "https://github.com/${{ github.repository }}/tree/${{ needs.create-snapshot.outputs.snapshot_branch }}"
    secrets: inherit

  # ─────────────────────────────────────────────
  # STEP 7 — Wait final 5 minutes
  # ─────────────────────────────────────────────
  wait-final:
    needs: [create-snapshot, wait-main]
    runs-on: ubuntu-latest
    steps:
      - name: Wait final 5 minutes
        run: |
          echo "⏳ Final wait started. Polling Tracking PR for target time..."
          
          while true; do
            ACTIVE_PR=$(gh pr list --repo ${{ github.repository }} --state open --label "APM-02 Active" --json number --jq '.[0].number')
            TARGET_TIME_IST=$(gh pr view "$ACTIVE_PR" --repo ${{ github.repository }} --json body --jq '.body' | grep -oP 'starts at \K.*?(?=\))')
            TIME_STR=$(echo "$TARGET_TIME_IST" | sed 's/ IST//')
            
            TARGET_TS=$(TZ='Asia/Kolkata' date -d "$TIME_STR" +%s)
            NOW_TS=$(TZ='Asia/Kolkata' date +%s)
            
            if [ "$NOW_TS" -ge "$TARGET_TS" ]; then
              echo "✅ Final wait complete. Target time reached. Proceeding to deployment."
              break
            fi
            
            DIFF=$((TARGET_TS - NOW_TS))
            echo "⏳ Final wait: $DIFF seconds remaining. Sleeping for 15s..."
            sleep 15
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────
  # STEP 8 — Merge snapshot → apm-02
  # ─────────────────────────────────────────────
  merge-to-apm02:
    needs: [create-snapshot, wait-final]
    runs-on: ubuntu-latest
    outputs:
      apm02_pr_number: ${{ steps.merge.outputs.apm02_pr_number }}
      merge_success: ${{ steps.merge.outputs.merge_success }}
      has_conflicts: ${{ steps.merge.outputs.has_conflicts }}
      merge_time_ist: ${{ steps.merge.outputs.merge_time_ist }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-snapshot.outputs.snapshot_branch }}
          fetch-depth: 0

      - name: Set State to DEPLOYING (Update Tracking PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTIVE_PR=$(gh pr list --repo ${{ github.repository }} --state open --label "APM-02 Active" --json number --jq '.[0].number')
          if [ -n "$ACTIVE_PR" ]; then
            gh pr edit "$ACTIVE_PR" --repo ${{ github.repository }} --title "🔵 APM-02 Deploying: ${{ needs.create-snapshot.outputs.snapshot_branch }}" --remove-label "APM-02 Active" --add-label "APM-02 Deploying"
            echo "✅ State updated to DEPLOYING on PR #$ACTIVE_PR"
          else
            echo "⚠️ Could not find open PR to update state."
          fi

      - name: Merge snapshot into apm-02
        id: merge
        run: |
          SNAPSHOT="${{ needs.create-snapshot.outputs.snapshot_branch }}"
          MERGE_TIME=$(TZ='Asia/Kolkata' date +'%H:%M IST')
          echo "merge_time_ist=$MERGE_TIME" >> $GITHUB_OUTPUT

          git fetch --all

          if [ -z "$(git log origin/tenant/asint-apm-02..HEAD --oneline)" ]; then
            echo "ℹ️ No new commits to merge. The apm-02 branch already contains all changes from the snapshot."
            echo "merge_success=true" >> $GITHUB_OUTPUT
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "apm02_pr_number=" >> $GITHUB_OUTPUT
            exit 0
          fi

          gh label create "auto merge for APM02" --color "#e11d48" --description "APM-02 deployment PR" 2>/dev/null || true

          PR_NUMBER=$(gh pr list \
            --base tenant/asint-apm-02 \
            --head "$SNAPSHOT" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            PR_BODY_APM02=$(printf '%s\n' \
              "Auto-generated deployment PR." \
              "" \
              "**Snapshot:** \`$SNAPSHOT\`" \
              "**Initiated by:** ${{ github.actor }}" \
              "**Triggered at:** $MERGE_TIME" \
              "" \
              "This PR merges the snapshot into \`tenant/asint-apm-02\` to trigger SAP CI/CD deployment.")

            gh pr create \
              --base tenant/asint-apm-02 \
              --head "$SNAPSHOT" \
              --title "Merging from $SNAPSHOT into tenant/asint-apm-02" \
              --body "$PR_BODY_APM02"

            PR_NUMBER=$(gh pr list \
              --base tenant/asint-apm-02 \
              --head "$SNAPSHOT" \
              --json number \
              --jq '.[0].number')

            gh pr edit "$PR_NUMBER" --add-label "auto merge for APM02"
            echo "✅ PR #$PR_NUMBER created"
          else
            echo "ℹ️ Existing PR #$PR_NUMBER found"
          fi

          echo "apm02_pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          for i in {1..10}; do
            STATUS=$(gh pr view "$PR_NUMBER" --json mergeable --jq '.mergeable')
            echo "Attempt $i: '$STATUS'"
            if [[ "$STATUS" == "MERGEABLE" ]]; then
              echo "merge_success=true" >> $GITHUB_OUTPUT
              echo "has_conflicts=false" >> $GITHUB_OUTPUT

              if gh pr merge "$PR_NUMBER" --merge; then
                echo "✅ PR #$PR_NUMBER merged into apm-02 successfully"
              else
                gh pr comment "$PR_NUMBER" --body "Auto-merge failed during merge step. Please check the workflow logs."
                echo "merge_success=false" >> $GITHUB_OUTPUT
                exit 1
              fi
              exit 0
            elif [[ "$STATUS" == "CONFLICTING" ]]; then
              echo "merge_success=false" >> $GITHUB_OUTPUT
              echo "has_conflicts=true" >> $GITHUB_OUTPUT
              gh pr comment "$PR_NUMBER" --body "⚠️ Auto-merge blocked: merge conflicts detected between \`$SNAPSHOT\` and \`tenant/asint-apm-02\`. Manual resolution required before deployment can proceed."
              echo "❌ PR #$PR_NUMBER has conflicts"
              exit 1
            fi
            sleep 10
          done

          gh pr comment "$PR_NUMBER" --body "Auto-merge timed out waiting for mergeability status. Please check manually."
          echo "merge_success=false" >> $GITHUB_OUTPUT
          echo "has_conflicts=false" >> $GITHUB_OUTPUT
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────
  # STEP 9 — Notify conflict if merge to apm-02 failed
  # ─────────────────────────────────────────────
  notify-conflict:
    needs: [create-snapshot, merge-to-apm02]
    if: failure() && needs.merge-to-apm02.outputs.has_conflicts == 'true'
    uses: ./.github/workflows/_apm02_notify.yml
    with:
      card_title: "⚠️ APM-02 Deployment Blocked — Merge Conflicts"
      card_subtitle: "Merge conflicts detected between the snapshot and apm-02. Manual resolution is required. State is BLOCKED."
      status_text: "⚠️ Merge Conflicts Detected"
      status_color: "attention"
      snapshot_branch: ${{ needs.create-snapshot.outputs.snapshot_branch }}
      pr_number: ${{ needs.merge-to-apm02.outputs.apm02_pr_number }}
      extra_fact_title: "⚠️ Next Step for DevOps"
      extra_fact_value: "1. Resolve conflicts in the PR below. 2. Merge the PR manually. 3. Ensure SAP CI/CD starts."
      action_label: "View Conflicting PR"
      action_url: "https://github.com/${{ github.repository }}/pull/${{ needs.merge-to-apm02.outputs.apm02_pr_number }}"
    secrets: inherit

  # ─────────────────────────────────────────────
  # STEP 10 — Notify apm-02 merge success + SAP CI/CD started
  # ─────────────────────────────────────────────
  notify-apm02-merged:
    needs: [create-snapshot, merge-to-apm02]
    if: success()
    uses: ./.github/workflows/_apm02_notify.yml
    with:
      card_title: "🚀 APM-02 Deployment Triggered"
      card_subtitle: "Snapshot merged into tenant/asint-apm-02. SAP CI/CD deployment has started automatically. Deployment takes approximately 35-40 minutes."
      status_text: "✅ Merged into tenant/asint-apm-02 — SAP CI/CD Started"
      status_color: "good"
      snapshot_branch: ${{ needs.create-snapshot.outputs.snapshot_branch }}
      pr_number: ${{ needs.merge-to-apm02.outputs.apm02_pr_number }}
      extra_fact_title: "⚠️ Snapshot Closed"
      extra_fact_value: "This snapshot is now closed for cherry-picks. The final merge to main will happen automatically via a webhook when SAP CI/CD finishes."
      action_label: "View PR on GitHub"
      action_url: "https://github.com/${{ github.repository }}/pull/${{ needs.merge-to-apm02.outputs.apm02_pr_number }}"
    secrets: inherit
