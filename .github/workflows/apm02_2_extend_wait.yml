name: "Deploy APM-02: 2. Extend Wait Window"

# An admin triggers this during the waiting window to give developers more (or less) time.
# This workflow adjusts the requested duration, then notifies the channel.

on:
  workflow_dispatch:
    inputs:
      deploy_now:
        description: "Deploy Immediately (skip remaining wait)"
        type: boolean
        required: false
        default: false
      adjust_minutes:
        description: "How many minutes to adjust? (+ for extend, - for decrease)"
        required: true
        default: "10"
        type: choice
        options:
          - "-30"
          - "-20"
          - "-10"
          - "-5"
          - "5"
          - "10"
          - "20"
          - "30"

jobs:
  # ─────────────────────────────────────────────
  # Guard: only allow extension if a snapshot is active
  # ─────────────────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      active_snapshot: ${{ steps.check.outputs.active_snapshot }}
      adjust_time_ist: ${{ steps.check.outputs.adjust_time_ist }}
      action_word: ${{ steps.check.outputs.action_word }}
      summary_text: ${{ steps.check.outputs.summary_text }}
    steps:
      - name: Check active snapshot and update PR
        id: check
        run: |
          ACTIVE_PR_JSON=$(gh pr list --repo ${{ github.repository }} --state open --label "APM-02 Active" --json number,headRefName --jq '.[0]')
          
          if [ -n "$ACTIVE_PR_JSON" ] && [ "$ACTIVE_PR_JSON" != "null" ]; then
            ACTIVE=$(echo "$ACTIVE_PR_JSON" | jq -r '.headRefName')
            PR_NUM=$(echo "$ACTIVE_PR_JSON" | jq -r '.number')
            
            CURRENT_TARGET=$(gh pr view "$PR_NUM" --repo ${{ github.repository }} --json body -q '.body' | grep -oP 'starts at \K.*?(?=\))')
            TIME_STR=$(echo "$CURRENT_TARGET" | sed 's/ IST//')
            
            if [ "${{ inputs.deploy_now }}" == "true" ]; then
              EXTEND_TIME_IST=$(TZ='Asia/Kolkata' date +'%I:%M %p IST')
              ACTION_WORD="Force-Started"
              SUMMARY_TEXT="Force-Started (new time: $EXTEND_TIME_IST)"
            else
              EXTEND_TIME_IST=$(TZ='Asia/Kolkata' date -d "$TIME_STR + ${{ inputs.adjust_minutes }} minutes" +'%I:%M %p IST')
              ADJUST_VAL="${{ inputs.adjust_minutes }}"
              if [[ "$ADJUST_VAL" == -* ]]; then
                ACTION_WORD="Decreased"
                CLEAN_VAL="${ADJUST_VAL#-}"
              else
                ACTION_WORD="Extended"
                CLEAN_VAL="$ADJUST_VAL"
              fi
              SUMMARY_TEXT="$ACTION_WORD by $CLEAN_VAL minutes (new time: $EXTEND_TIME_IST)"
            fi
            
            OLD_BODY=$(gh pr view "$PR_NUM" --repo ${{ github.repository }} --json body -q '.body')
            NEW_BODY="${OLD_BODY//$CURRENT_TARGET/$EXTEND_TIME_IST}"
            
            if ! echo "$NEW_BODY" | grep -q "---"; then
              NEW_BODY=$(printf '%s\n\n---\n**Extensions Log:**' "$NEW_BODY")
            fi
            
            NEW_BODY=$(printf '%s\n- ⏳ %s by @%s (New time: %s)' "$NEW_BODY" "$SUMMARY_TEXT" "${{ github.actor }}" "$EXTEND_TIME_IST")
            
            gh pr edit "$PR_NUM" --repo ${{ github.repository }} --body "$NEW_BODY"
            
            echo "active_snapshot=$ACTIVE" >> $GITHUB_OUTPUT
            echo "adjust_time_ist=$EXTEND_TIME_IST" >> $GITHUB_OUTPUT
            echo "action_word=$ACTION_WORD" >> $GITHUB_OUTPUT
            echo "summary_text=$SUMMARY_TEXT" >> $GITHUB_OUTPUT
            echo "✅ Active snapshot '$ACTIVE' found (PR #$PR_NUM). Time extended to $EXTEND_TIME_IST."
          else
            echo "active_snapshot=" >> $GITHUB_OUTPUT
            echo "❌ Blocked: No active snapshot found. You can only extend when a deployment is active."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────
  # Notify Teams: adjustment started
  # ─────────────────────────────────────────────
  notify-adjustment:
    needs: guard
    uses: ./.github/workflows/_apm02_notify.yml
    with:
      card_title: "⏳ APM-02 Waiting Window Modified"
      card_subtitle: "An admin has ${{ needs.guard.outputs.action_word }} the waiting window."
      status_text: "⏳ ${{ needs.guard.outputs.summary_text }}"
      status_color: "accent"
      snapshot_branch: ${{ needs.guard.outputs.active_snapshot }}
      extra_fact_title: "Deployment Schedule"
      extra_fact_value: "APM-02 deployment will now start at ${{ needs.guard.outputs.adjust_time_ist }}."
      action_label: "View Snapshot Branch"
      action_url: "https://github.com/${{ github.repository }}/tree/${{ needs.guard.outputs.active_snapshot }}"
    secrets: inherit
