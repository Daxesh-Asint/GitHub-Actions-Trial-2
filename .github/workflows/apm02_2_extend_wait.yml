name: "[2] APM-02 Extend Waiting Window (Optional)"

# DevOps triggers this during the waiting window to give developers more time.
# This workflow pauses for the requested extension duration, then notifies the
# channel that the extension is over and deployment will proceed.

on:
  workflow_dispatch:
    inputs:
      extend_minutes:
        description: "How many extra minutes to wait before deployment proceeds"
        required: true
        default: "10"
        type: choice
        options:
          - "5"
          - "10"
          - "15"
          - "20"
          - "30"

jobs:
  # ─────────────────────────────────────────────
  # Guard: only allow extension if a snapshot is active
  # ─────────────────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      active_snapshot: ${{ steps.check.outputs.active_snapshot }}
      extend_time_ist: ${{ steps.check.outputs.extend_time_ist }}
    steps:
      - name: Check active snapshot and update PR
        id: check
        run: |
          ACTIVE_PR_JSON=$(gh pr list --repo ${{ github.repository }} --state open --label "APM-02 Active" --json number,headRefName --jq '.[0]')
          
          if [ -n "$ACTIVE_PR_JSON" ] && [ "$ACTIVE_PR_JSON" != "null" ]; then
            ACTIVE=$(echo "$ACTIVE_PR_JSON" | jq -r '.headRefName')
            PR_NUM=$(echo "$ACTIVE_PR_JSON" | jq -r '.number')
            
            CURRENT_TARGET=$(gh pr view "$PR_NUM" --repo ${{ github.repository }} --json body -q '.body' | grep -oP 'starts at \K.*?(?=\))')
            TIME_STR=$(echo "$CURRENT_TARGET" | sed 's/ IST//')
            
            EXTEND_TIME_IST=$(TZ='Asia/Kolkata' date -d "$TIME_STR + ${{ inputs.extend_minutes }} minutes" +'%I:%M %p IST')
            
            OLD_BODY=$(gh pr view "$PR_NUM" --repo ${{ github.repository }} --json body -q '.body')
            NEW_BODY="${OLD_BODY//$CURRENT_TARGET/$EXTEND_TIME_IST}"
            
            if ! echo "$NEW_BODY" | grep -q "---"; then
              NEW_BODY=$(printf '%s\n\n---\n**Extensions Log:**' "$NEW_BODY")
            fi
            
            NEW_BODY=$(printf '%s\n- ⏳ Extended by **%s minutes** by @%s (New time: %s)' "$NEW_BODY" "${{ inputs.extend_minutes }}" "${{ github.actor }}" "$EXTEND_TIME_IST")
            
            gh pr edit "$PR_NUM" --repo ${{ github.repository }} --body "$NEW_BODY"
            
            echo "active_snapshot=$ACTIVE" >> $GITHUB_OUTPUT
            echo "extend_time_ist=$EXTEND_TIME_IST" >> $GITHUB_OUTPUT
            echo "✅ Active snapshot '$ACTIVE' found (PR #$PR_NUM). Time extended to $EXTEND_TIME_IST."
          else
            echo "active_snapshot=" >> $GITHUB_OUTPUT
            echo "❌ Blocked: No active snapshot found. You can only extend when a deployment is active."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────
  # Notify Teams: extension started
  # ─────────────────────────────────────────────
  notify-extension-started:
    needs: guard
    uses: ./.github/workflows/_apm02_notify.yml
    with:
      card_title: "⏳ APM-02 Waiting Window Extended"
      card_subtitle: "DevOps has extended the waiting window. Deployment will be delayed to give developers more time to cherry-pick."
      status_text: "⏳ Extended by ${{ inputs.extend_minutes }} minutes (until ${{ needs.guard.outputs.extend_time_ist }})"
      status_color: "accent"
      snapshot_branch: ${{ needs.guard.outputs.active_snapshot }}
      extra_fact_title: "Deployment Schedule"
      extra_fact_value: "Extended by ${{ inputs.extend_minutes }} minutes. APM-02 deployment will now start at ${{ needs.guard.outputs.extend_time_ist }}."
      action_label: "View Snapshot Branch"
      action_url: "https://github.com/${{ github.repository }}/tree/${{ needs.guard.outputs.active_snapshot }}"
    secrets: inherit
