name: "APM-02: Guard - Main PR Conflicts"

on:
  pull_request:
    types: [synchronize, closed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-merge-resolved:
    if: github.event.action == 'synchronize' && github.event.pull_request.base.ref == 'main' && contains(github.event.pull_request.labels.*.name, 'APM-02 Blocked')
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Mergeability Check
        run: sleep 10 # Give GitHub time to compute mergeability

      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check Mergeability and Auto-Merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Wait up to 30 seconds for mergeable state to be determined
          for i in {1..6}; do
            MERGEABLE=$(gh pr view "$PR_NUMBER" --repo ${{ github.repository }} --json mergeable -q .mergeable)
            if [ "$MERGEABLE" == "UNKNOWN" ]; then
              echo "Mergeable state is UNKNOWN. Waiting..."
              sleep 5
            else
              break
            fi
          done

          echo "Final mergeable state: $MERGEABLE"
          
          if [ "$MERGEABLE" == "MERGEABLE" ]; then
            echo "✅ Conflicts have been resolved! PR is now mergeable."
            
            # Update labels
            gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} \
              --title "🟢 APM-02 Blocked (Conflicts Resolved): Merging from ${{ github.event.pull_request.head.ref }} to main" \
              --remove-label "APM-02 Blocked" \
              --add-label "APM-02 Blocked (Conflicts Resolved)"
              
            echo "Marking PR as ready (in case it is a draft)..."
            gh pr ready "$PR_NUMBER" --repo ${{ github.repository }} 2>/dev/null || true
              
            echo "Attempting to auto-merge..."
            gh pr merge "$PR_NUMBER" --repo ${{ github.repository }} --merge --admin
            echo "✅ PR successfully merged."
          else
            echo "⚠️ PR is still not mergeable. Conflicts remain or checks are failing."
          fi

  notify-and-update-wiki:
    needs: auto-merge-resolved
    if: always() && (
          (needs.auto-merge-resolved.result == 'success' && github.event.action == 'synchronize') || 
          (github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && (contains(github.event.pull_request.labels.*.name, 'APM-02 Blocked') || contains(github.event.pull_request.labels.*.name, 'APM-02 Blocked (Conflicts Resolved)')))
        )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout Wiki
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update Wiki (Post-Conflict)
        run: |
          if [ -d "wiki" ]; then
            node .github/scripts/update_wiki.js || echo "Wiki update failed"
          else
            echo "Wiki repo not found, skipping."
          fi
        env:
          WIKI_PAYLOAD: '{"action": "post-conflict", "snapshot": "${{ github.event.pull_request.head.ref }}"}'

  notify-success:
    needs: [auto-merge-resolved, notify-and-update-wiki]
    if: always() && (
          (needs.auto-merge-resolved.result == 'success' && github.event.action == 'synchronize') || 
          (github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && (contains(github.event.pull_request.labels.*.name, 'APM-02 Blocked') || contains(github.event.pull_request.labels.*.name, 'APM-02 Blocked (Conflicts Resolved)')))
        )
    uses: ./.github/workflows/_apm02_notify.yml
    with:
      card_title: "✅ APM-02 Deployment Cycle Complete (Conflicts Resolved)"
      card_subtitle: "Merge conflicts were resolved and PR #${{ github.event.pull_request.number }} was successfully merged into main. Snapshot branch deleted."
      status_text: "✅ Deployment & Merge Complete"
      status_color: "good"
      snapshot_branch: "${{ github.event.pull_request.head.ref }} (Deleted 🗑️)"
      pr_number: ${{ github.event.pull_request.number }}
      extra_fact_title: "Cycle State"
      extra_fact_value: "Reset to IDLE. Snapshot branch deleted."
      action_label: "Review main PR #${{ github.event.pull_request.number }}"
      action_url: "https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
    secrets: inherit

  delete-snapshot-branch:
    needs: [auto-merge-resolved, notify-and-update-wiki, notify-success]
    if: always() && needs.notify-success.result == 'success' && (needs.auto-merge-resolved.result == 'success' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete Remote Snapshot Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SNAPSHOT="${{ github.event.pull_request.head.ref }}"
          echo "Target snapshot branch: [$SNAPSHOT]"
          
          # Safety check: branch must strictly match snapshot/main-
          if [[ "$SNAPSHOT" =~ ^snapshot/main- ]]; then
            echo "🗑️ Deleting remote snapshot branch $SNAPSHOT via GitHub API..."
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$SNAPSHOT" || echo "Branch $SNAPSHOT might already be deleted."
            echo "✅ Remote snapshot branch $SNAPSHOT deleted successfully."
          else
            echo "⚠️ Safety guard: '$SNAPSHOT' does not match snapshot/main-*. Skipping deletion."
          fi
