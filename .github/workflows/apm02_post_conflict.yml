name: "[3] APM-02 Post-Conflict Merge (On Conflict)"

# Trigger this AFTER manually resolving merge conflicts and merging
# the snapshot into apm-02. This workflow completes the cycle by:
# 1. Merging the snapshot into main
# 2. Clearing the active snapshot variable
# 3. Updating the GitHub Release tag
# 4. Updating the GitHub Wiki
# 5. Sending Teams notification

on:
  workflow_dispatch:
    inputs:
      snapshot_branch:
        description: "Snapshot branch name (e.g. snapshot/main-260719-1430)"
        required: true
        type: string
      apm02_pr_number:
        description: "PR number that was merged into apm-02 (for Wiki record)"
        required: true
        type: string

jobs:
  # ─────────────────────────────────────────────
  # Guard: verify snapshot branch exists
  # ─────────────────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    outputs:
      snapshot_valid: ${{ steps.check.outputs.snapshot_valid }}
    steps:
      - name: Verify snapshot branch exists
        id: check
        run: |
          SNAPSHOT="${{ inputs.snapshot_branch }}"

          # Check branch exists on remote
          EXISTS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/branches/$( echo "$SNAPSHOT" | sed 's|/|%2F|g') \
            --jq '.name' 2>/dev/null || echo "")

          if [ -z "$EXISTS" ]; then
            echo "❌ Snapshot branch '$SNAPSHOT' not found in repository."
            exit 1
          fi

          echo "snapshot_valid=true" >> $GITHUB_OUTPUT
          echo "✅ Snapshot branch '$SNAPSHOT' verified"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────
  # Notify Teams: post-conflict merge starting
  # ─────────────────────────────────────────────
  notify-starting:
    needs: guard
    uses: ./.github/workflows/_apm02_notify.yml
    with:
      card_title: "🔁 APM-02 Post-Conflict Merge Starting"
      card_subtitle: "Conflicts have been resolved. Completing the deployment cycle by merging snapshot into main."
      status_text: "🔁 Merging Snapshot into Main"
      status_color: "accent"
      snapshot_branch: ${{ inputs.snapshot_branch }}
      pr_number: ${{ inputs.apm02_pr_number }}
      extra_fact_title: "Triggered By"
      extra_fact_value: "${{ github.actor }}"
      action_label: "View APM-02 PR"
      action_url: "https://github.com/${{ github.repository }}/pull/${{ inputs.apm02_pr_number }}"
    secrets: inherit

  # ─────────────────────────────────────────────
  # Merge snapshot → main
  # ─────────────────────────────────────────────
  merge-to-main:
    needs: [guard, notify-starting]
    runs-on: ubuntu-latest
    outputs:
      main_pr_number: ${{ steps.merge.outputs.main_pr_number }}
      merge_success: ${{ steps.merge.outputs.merge_success }}
      has_conflicts: ${{ steps.merge.outputs.has_conflicts }}
      merge_time_ist: ${{ steps.merge.outputs.merge_time_ist }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.snapshot_branch }}
          fetch-depth: 0

      - name: Merge snapshot into main
        id: merge
        run: |
          SNAPSHOT="${{ inputs.snapshot_branch }}"
          MERGE_TIME=$(TZ='Asia/Kolkata' date +'%H:%M IST')
          echo "merge_time_ist=$MERGE_TIME" >> $GITHUB_OUTPUT

          git fetch --all

          # Ensure label exists
          gh label create "apm02-to-main" --color "#16a34a" --description "APM-02 snapshot to main PR" 2>/dev/null || true

          # Check for existing PR
          PR_NUMBER=$(gh pr list \
            --base main \
            --head "$SNAPSHOT" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            PR_BODY=$(printf '%s\n' \
              "Post-conflict merge PR to sync snapshot back into \`main\`." \
              "" \
              "**Snapshot:** \`$SNAPSHOT\`" \
              "**APM-02 PR:** #${{ inputs.apm02_pr_number }}" \
              "**Initiated by:** ${{ github.actor }}" \
              "" \
              "> Conflicts were resolved manually. This PR completes the deployment cycle.")

            gh pr create \
              --base main \
              --head "$SNAPSHOT" \
              --title "🔁 Sync to Main: $SNAPSHOT" \
              --body "$PR_BODY"

            PR_NUMBER=$(gh pr list \
              --base main \
              --head "$SNAPSHOT" \
              --json number \
              --jq '.[0].number')

            gh pr edit "$PR_NUMBER" --add-label "apm02-to-main"
            echo "✅ PR #$PR_NUMBER created for snapshot → main"
          else
            echo "ℹ️ Existing PR #$PR_NUMBER found"
          fi

          echo "main_pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          # Check mergeability (same pattern as _auto_merge.yml)
          for i in {1..10}; do
            STATUS=$(gh pr view "$PR_NUMBER" --json mergeable --jq '.mergeable')
            echo "Attempt $i: '$STATUS'"
            if [[ "$STATUS" == "MERGEABLE" ]]; then
              if gh pr merge "$PR_NUMBER" --merge; then
                echo "merge_success=true" >> $GITHUB_OUTPUT
                echo "has_conflicts=false" >> $GITHUB_OUTPUT
                echo "✅ PR #$PR_NUMBER merged into main successfully"
              else
                gh pr comment "$PR_NUMBER" --body "Auto-merge into main failed. Please check the workflow logs."
                echo "merge_success=false" >> $GITHUB_OUTPUT
                echo "has_conflicts=false" >> $GITHUB_OUTPUT
                exit 1
              fi
              exit 0
            elif [[ "$STATUS" == "CONFLICTING" ]]; then
              echo "merge_success=false" >> $GITHUB_OUTPUT
              echo "has_conflicts=true" >> $GITHUB_OUTPUT
              gh pr comment "$PR_NUMBER" --body "⚠️ Merge conflict detected between \`$SNAPSHOT\` and \`main\`. Manual resolution required."
              exit 1
            fi
            sleep 10
          done

          echo "merge_success=false" >> $GITHUB_OUTPUT
          echo "has_conflicts=false" >> $GITHUB_OUTPUT
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # ─────────────────────────────────────────────
  # Clear active snapshot + update Release tag
  # ─────────────────────────────────────────────
  close-snapshot:
    needs: [merge-to-main]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # APM02_ACTIVE_SNAPSHOT repo variable is no longer used

      - name: Update GitHub Release tag to closed
        run: |
          SNAPSHOT="${{ inputs.snapshot_branch }}"
          DATE_IST=$(TZ='Asia/Kolkata' date +'%a, %b %d %Y')
          TIME_IST=$(TZ='Asia/Kolkata' date +'%H:%M IST')

          gh release delete "apm02-active-snapshot" --repo ${{ github.repository }} --yes 2>/dev/null || true
          git push origin --delete refs/tags/apm02-active-snapshot 2>/dev/null || true

          CLOSED_NOTES=$(printf '%s\n' \
            "**Last Closed Snapshot:** \`$SNAPSHOT\`" \
            "" \
            "**Closed at:** $DATE_IST at $TIME_IST" \
            "**Closed by:** ${{ github.actor }}" \
            "**Status:** ✅ Fully merged into tenant/asint-apm-02-v2 and main (post-conflict resolution)" \
            "" \
            "> No active deployment in progress. An admin may start a new snapshot.")

          gh release create "apm02-active-snapshot" --repo ${{ github.repository }} \
            --title "🔴 APM-02 Last Closed Snapshot" \
            --notes "$CLOSED_NOTES" \
            --target main \
            --latest
          echo "✅ Release tag updated to closed state"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  update-wiki-post-conflict:
    needs: [merge-to-main]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Checkout Wiki
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Update Wiki (Post Conflict)
        run: |
          if [ -d "wiki" ]; then
            node .github/scripts/update_wiki.js || echo "Wiki update failed"
          else
            echo "Wiki repo not found, skipping."
          fi
        env:
          WIKI_PAYLOAD: '{"action": "post-conflict", "snapshot": "${{ inputs.snapshot_branch }}", "pr_number": "${{ needs.merge-to-main.outputs.main_pr_number }}"}'

  # ─────────────────────────────────────────────
  # Notify Teams: cycle complete
  # ─────────────────────────────────────────────
  notify-complete:
    needs: [merge-to-main, close-snapshot]
    if: success()
    uses: ./.github/workflows/_apm02_notify.yml
    with:
      card_title: "✅ APM-02 Post-Conflict Cycle Complete"
      card_subtitle: "Snapshot has been successfully merged into main after conflict resolution. Main is now up to date and ready for the next snapshot."
      status_text: "✅ Snapshot Merged into Main"
      status_color: "good"
      snapshot_branch: ${{ inputs.snapshot_branch }}
      pr_number: ${{ inputs.apm02_pr_number }}
      extra_fact_title: "Main PR"
      extra_fact_value: "PR #${{ needs.merge-to-main.outputs.main_pr_number }}"
      action_label: "View APM-02 PR"
      action_url: "https://github.com/${{ github.repository }}/pull/${{ inputs.apm02_pr_number }}"
    secrets: inherit

  # ─────────────────────────────────────────────
  # Notify Teams: merge to main failed
  # ─────────────────────────────────────────────
  notify-failed:
    needs: [merge-to-main]
    if: failure()
    uses: ./.github/workflows/_apm02_notify.yml
    with:
      card_title: "❌ APM-02 Post-Conflict Merge Failed"
      card_subtitle: "Merging snapshot into main failed. Please check the workflow logs and resolve manually."
      status_text: "❌ Merge into Main Failed"
      status_color: "attention"
      snapshot_branch: ${{ inputs.snapshot_branch }}
      pr_number: ${{ inputs.apm02_pr_number }}
      extra_fact_title: "Action Required"
      extra_fact_value: "Check workflow logs and merge manually if needed."
      action_label: "View Workflow Run"
      action_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    secrets: inherit

  # ─────────────────────────────────────────────
  # Update GitHub Wiki
  # ─────────────────────────────────────────────
  update-wiki:
    needs: [merge-to-main, close-snapshot]
    if: always() && needs.merge-to-main.result != 'skipped'
    uses: ./.github/workflows/_apm02_wiki.yml
    permissions:
      contents: write
    with:
      snapshot_branch: ${{ inputs.snapshot_branch }}
      date_ist: ${{ needs.merge-to-main.outputs.merge_time_ist }}
      apm02_pr_number: ${{ inputs.apm02_pr_number }}
      main_pr_number: ${{ needs.merge-to-main.outputs.main_pr_number }}
      initiated_by: ${{ github.actor }}
      merge_time_ist: ${{ needs.merge-to-main.outputs.merge_time_ist }}
      status: ${{ needs.merge-to-main.outputs.merge_success == 'true' && 'Merged' || needs.merge-to-main.outputs.has_conflicts == 'true' && 'Conflict' || 'Failed' }}
    secrets: inherit
