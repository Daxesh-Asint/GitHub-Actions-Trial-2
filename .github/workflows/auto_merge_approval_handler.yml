          TEAMS_WEBHOOK_IRC_DC_1: ${{ secrets.TEAMS_WEBHOOK_IRC_DC_1 }}
          TEAMS_WEBHOOK_IRC_DC_2: ${{ secrets.TEAMS_WEBHOOK_IRC_DC_2 }}
          TEAMS_WEBHOOK_IRC_DC_3: ${{ secrets.TEAMS_WEBHOOK_IRC_DC_3 }}
          TEAMS_WEBHOOK_IRC_DC_ADDIN_1: ${{ secrets.TEAMS_WEBHOOK_IRC_DC_ADDIN_1 }}
          TEAMS_WEBHOOK_IRC_DC_ADDIN_2: ${{ secrets.TEAMS_WEBHOOK_IRC_DC_ADDIN_2 }}
          TEAMS_WEBHOOK_IRC_DC_ADDIN_3: ${{ secrets.TEAMS_WEBHOOK_IRC_DC_ADDIN_3 }}
          TEAMS_WEBHOOK_ST_ENV_DC_1: ${{ secrets.TEAMS_WEBHOOK_ST_ENV_DC_1 }}
          TEAMS_WEBHOOK_ST_ENV_DC_2: ${{ secrets.TEAMS_WEBHOOK_ST_ENV_DC_2 }}
          TEAMS_WEBHOOK_ST_ENV_DC_3: ${{ secrets.TEAMS_WEBHOOK_ST_ENV_DC_3 }}
          TEAMS_WEBHOOK_ST_ENV_DC_ADDIN_1: ${{ secrets.TEAMS_WEBHOOK_ST_ENV_DC_ADDIN_1 }}
          TEAMS_WEBHOOK_ST_ENV_DC_ADDIN_2: ${{ secrets.TEAMS_WEBHOOK_ST_ENV_DC_ADDIN_2 }}
          TEAMS_WEBHOOK_ST_ENV_DC_ADDIN_3: ${{ secrets.TEAMS_WEBHOOK_ST_ENV_DC_ADDIN_3 }}
          TEAMS_WEBHOOK_VMOS_DC_1: ${{ secrets.TEAMS_WEBHOOK_VMOS_DC_1 }}
          TEAMS_WEBHOOK_VMOS_DC_2: ${{ secrets.TEAMS_WEBHOOK_VMOS_DC_2 }}
          TEAMS_WEBHOOK_VMOS_DC_3: ${{ secrets.TEAMS_WEBHOOK_VMOS_DC_3 }}
          TEAMS_WEBHOOK_VMOS_DC_ADDIN_1: ${{ secrets.TEAMS_WEBHOOK_VMOS_DC_ADDIN_1 }}
          TEAMS_WEBHOOK_VMOS_DC_ADDIN_2: ${{ secrets.TEAMS_WEBHOOK_VMOS_DC_ADDIN_2 }}
          TEAMS_WEBHOOK_VMOS_DC_ADDIN_3: ${{ secrets.TEAMS_WEBHOOK_VMOS_DC_ADDIN_3 }}
        run: |
          chmod +x .github/scripts/notify_approval_handler.sh
          ./.github/scripts/notify_approval_handler.sh

      # ──────────────────────────────────────────────────────────
      # 📖 Global Wiki Deployment History Update
      # ──────────────────────────────────────────────────────────
      - name: Checkout Wiki
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}

      - name: Setup Node.js for Wiki
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update Global Wiki Deployment History
        if: always()
        run: |
          if [ -d "wiki" ]; then
            PR_NUM="${{ github.event.pull_request.number || github.event.issue.number }}"
            COMMIT_ID=""
            if [ -n "$PR_NUM" ]; then
              COMMIT_ID=$(gh pr view "$PR_NUM" --json mergeCommit --jq '.mergeCommit.oid // empty' 2>/dev/null || true)
            fi

            export WIKI_PAYLOAD=$(jq -n \
              --arg env "${{ env.DEPLOY_NAME || env.base_branch }}" \
              --arg action "approval_merge" \
              --arg pr "$PR_NUM" \
              --arg commit "$COMMIT_ID" \
              --arg source "${{ github.event.pull_request.head.ref }}" \
              --arg target "${{ github.event.pull_request.base.ref }}" \
              --arg actor "${{ github.actor }}" \
              --arg status "Approved & Merged" \
              '{
                environment: $env,
                action: $action,
                pr_number: $pr,
                commit_id: $commit,
                source_branch: $source,
                target_branch: $target,
                actor: $actor,
                status: $status
              }')

            node .github/scripts/update_wiki_global.js || echo "Global wiki update warning: script finished with error"
          else
            echo "Wiki repository not found. Skipping wiki update."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}
