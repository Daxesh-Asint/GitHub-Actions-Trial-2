name: "Deploy: APM-EIOT DC"

on:
  repository_dispatch:
    types: [trigger_apm_eiot_dc_deployment]

jobs:
  merging-process:
    uses: ./.github/workflows/_auto_merge.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      base: "tenant/asint-apm-eiot-dc"
      compare: "main-dc"
      deployment_name: "APM-EIOT DC"
      dashboard_url: "https://asint-payg-development.cicd.cfapps.eu10.hana.ondemand.com/ui/index.html#"
    secrets: inherit
