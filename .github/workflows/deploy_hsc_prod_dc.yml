name: "Deploy: HSC Prod DC"

on:
  repository_dispatch:
    types: [trigger_hsc_prod_dc_deployment]

jobs:
  merging-process:
    uses: ./.github/workflows/_auto_merge.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      base: "tenant/hemlock-prod-dc"
      compare: "tenant/hemlock-non-prod-dc"
      deployment_name: "HSC Prod DC"
      dashboard_url: "https://asint-payg-development.cicd.cfapps.eu10.hana.ondemand.com/ui/index.html#"
    secrets: inherit
