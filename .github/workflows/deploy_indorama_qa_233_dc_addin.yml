name: "Deploy: Indorama QA 233 DC AddIn"

on:
  repository_dispatch:
    types: [trigger_indorama_qa_233_dc_addin_deployment]

jobs:
  merging-process:
    uses: ./.github/workflows/_auto_merge.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      base: "tenant/indorama-qa-233-dc-addin"
      compare: "main-dc-addin"
      deployment_name: "Indorama QA 233 DC AddIn"
      dashboard_url: "https://asint-payg-development.cicd.cfapps.eu10.hana.ondemand.com/ui/index.html#"
    secrets: inherit
