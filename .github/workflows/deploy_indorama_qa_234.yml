name: "Deploy: Indorama QA 234"

on:
  repository_dispatch:
    types: [trigger_indorama_qa_234_deployment]

jobs:
  merging-process:
    uses: ./.github/workflows/_auto_merge.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      base: "tenant/indorama-qa-234"
      compare: "main"
      deployment_name: "Indorama QA 234"
      dashboard_url: "https://asint-payg-development.cicd.cfapps.eu10.hana.ondemand.com/ui/index.html#"
      cf_stop_app: "asint-ais-backend"
      cf_api: "https://api.cf.us10-001.hana.ondemand.com"
      cf_org: "indorama-ais-qa-234"
      cf_space: "ais-qa-234"
    secrets: inherit
