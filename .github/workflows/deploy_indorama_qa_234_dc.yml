name: "Deploy: Indorama QA 234 DC"

on:
  repository_dispatch:
    types: [trigger_indorama_qa_234_dc_deployment]

jobs:
  merging-process:
    uses: ./.github/workflows/_auto_merge.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      base: "tenant/indorama-qa-234-dc"
      compare: "main-dc"
      deployment_name: "Indorama QA 234 DC"
      dashboard_url: "https://asint-payg-development.cicd.cfapps.eu10.hana.ondemand.com/ui/index.html#"
    secrets: inherit
