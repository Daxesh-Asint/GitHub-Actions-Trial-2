name: AsInt Bot [Dev -> AIS-02]

on:
  workflow_dispatch:

jobs:
  merging-process:
    uses: ./.github/workflows/_auto_merge.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      base: "tenant/asint-ais-02"
      compare: "dev"
      deployment_name: "AIS-02"
    secrets: inherit

  conflict-notification:
    name: Notify AIS02 merge conflict block
    needs: merging-process
    if: ${{ always() && needs.merging-process.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send conflict Teams notification
        run: |
          PR_NUMBER="23"
          PR_URL="https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
          REPO="${{ github.repository }}"
          SOURCE="dev"
          TARGET="tenant/asint-ais-02"

          PAYLOAD=$(cat <<EOF
          {
            "type": "message",
            "attachments": [{
              "contentType": "application/vnd.microsoft.card.adaptive",
              "content": {
                "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                "type": "AdaptiveCard",
                "version": "1.4",
                "body": [
                  {
                    "type": "TextBlock",
                    "size": "Large",
                    "weight": "Bolder",
                    "text": "AIS02 deployment blocked due to merge conflicts",
                    "wrap": true
                  },
                  {
                    "type": "TextBlock",
                    "text": "The scheduled auto-merge from dev into tenant/asint-ais-02 could not complete because the branches are conflicting.",
                    "wrap": true,
                    "isSubtle": true
                  },
                  {
                    "type": "FactSet",
                    "facts": [
                      { "title": "Repository", "value": "$REPO" },
                      { "title": "Pull Request", "value": "PR #$PR_NUMBER" },
                      { "title": "Source Branch", "value": "$SOURCE" },
                      { "title": "Target Branch", "value": "$TARGET" }
                    ]
                  }
                ],
                "actions": [
                  {
                    "type": "Action.OpenUrl",
                    "title": "View PR on GitHub",
                    "url": "$PR_URL"
                  }
                ]
              }
            }]
          }
          EOF
          )

          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}"
