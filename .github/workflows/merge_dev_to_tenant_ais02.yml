name: AsInt Bot [Dev -> AIS-02]

on:
  # ──────────────────────────────────────────────────────────
  # Scheduled auto merge — runs 3 times a day on weekdays
  # (Mon–Fri) to merge dev into tenant/asint-ais-02.
  # Times are in IST (UTC+5:30).
  # ──────────────────────────────────────────────────────────
  # schedule:
  #   # 11:00 AM IST = 05:30 UTC
  #   - cron: '30 5 * * 1-5'
  #   # 2:00 PM IST = 08:30 UTC
  #   - cron: '30 8 * * 1-5'
  #   # 5:00 PM IST = 11:30 UTC
  #   - cron: '30 11 * * 1-5'

  # ──────────────────────────────────────────────────────────
  # Instant auto merge — triggers immediately when code is
  # pushed/merged into the dev branch. Uncomment to enable.
  # ──────────────────────────────────────────────────────────
  push:
    branches:
      - dev

  workflow_dispatch:

jobs:
  merging-process:
    uses: ./.github/workflows/_auto_merge.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      base: "tenant/asint-ais-02"
      compare: "dev"
      deployment_name: "AIS-02"
    secrets: inherit
