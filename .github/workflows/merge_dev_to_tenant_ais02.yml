name: AsInt Bot [Dev -> AIS-02]

on:

  schedule:
    # Catchup run — picks up any changes merged into dev after 9 PM IST
    # Runs at 6:30 AM IST (01:00 UTC) every weekday Mon-Fri
    - cron: '0 1 * * 1-5'

  # schedule:
  #   # 11:00 AM IST = 05:30 UTC
  #   - cron: '30 5 * * 1-5'
  #   # 2:00 PM IST = 08:30 UTC
  #   - cron: '30 8 * * 1-5'
  #   # 5:00 PM IST = 11:30 UTC
  #   - cron: '30 11 * * 1-5'

  push:
    branches:
      - dev

  workflow_dispatch:

jobs:
  merging-process:
    uses: ./.github/workflows/_auto_merge.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      base: "tenant/asint-ais-02"
      compare: "dev"
      deployment_name: "AIS-02"
    secrets: inherit

