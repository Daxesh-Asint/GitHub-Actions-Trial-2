name: AsInt Bot [Dev -> AIS-02]

on:
  push:
    branches:
      - dev

  repository_dispatch:
    types: [trigger_ais02_deployment]

  workflow_dispatch:

jobs:
  pre-stop-crawler:
    uses: ./.github/workflows/_cf_app_control.yml
    with:
      api_endpoint: "https://api.cf.eu10-004.hana.ondemand.com"
      org: "ais-02-eu10-org"
      space: "main"
      app_name: "crawler-layer-backend"
      action: "stop"
    secrets: inherit

  merging-process:
    needs: pre-stop-crawler
    uses: ./.github/workflows/_auto_merge.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      base: "tenant/asint-ais-02"
      compare: "dev"
      deployment_name: "AIS-02"
      dashboard_url: "https://asint-payg-development.cicd.cfapps.eu10.hana.ondemand.com/ui/index.html#/detail/AsInt-AIS-02/TwoColumnsBeginExpanded"
    secrets: inherit

