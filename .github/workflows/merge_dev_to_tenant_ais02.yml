name: AsInt Bot [Dev -> AIS-02]

on:
  push:
    branches:
      - dev

  repository_dispatch:
    types: [trigger_ais02_deployment]

  workflow_dispatch:

jobs:
  merging-process:
    uses: ./.github/workflows/_auto_merge.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      base: "tenant/asint-ais-02"
      compare: "dev"
      deployment_name: "AIS-02"
    secrets: inherit

