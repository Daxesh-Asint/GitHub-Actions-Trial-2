name: Protect Core Files
on:
  pull_request:
    branches:
      - main
      - tenant/asint-apm-02-v2

jobs:
  protect-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Revert protected files
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          
          CHANGED=false
          
          if git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD | grep -q '^mta\.yaml$'; then
            echo "mta.yaml was modified, reverting..."
            git checkout origin/${{ github.event.pull_request.base.ref }} -- mta.yaml || true
            CHANGED=true
          fi
          
          if git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD | grep -q '^xs-security\.json$'; then
            echo "xs-security.json was modified, reverting..."
            git checkout origin/${{ github.event.pull_request.base.ref }} -- xs-security.json || true
            CHANGED=true
          fi
          
          if [ "$CHANGED" = true ] && [ -n "$(git status --porcelain)" ]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git commit -m "chore: revert protected files (mta.yaml, xs-security.json) to match target branch"
            git push origin ${{ github.event.pull_request.head.ref }}
          fi
