name: Auto Rebase Replica Scheduler

on:
  push:
    branches:
      - 'tenant/st-env-exxon-replica'
  workflow_dispatch:

# Queue runs sequentially so back-to-back changes don't race
concurrency:
  group: rebase-replica-scheduler
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout scheduler branch
        uses: actions/checkout@v4
        with:
          ref: 'tenant/st-env-exxon-replica-scheduler'
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase onto tenant/st-env-exxon-replica
        run: |
          git fetch origin tenant/st-env-exxon-replica
          git rebase origin/tenant/st-env-exxon-replica
          git push origin tenant/st-env-exxon-replica-scheduler --force-with-lease

      - name: Report Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Auto Rebase Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "- **Source:** \`tenant/st-env-exxon-replica\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Target:** \`tenant/st-env-exxon-replica-scheduler\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** Rebase completed and pushed cleanly." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Auto Rebase Failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Source:** \`tenant/st-env-exxon-replica\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Target:** \`tenant/st-env-exxon-replica-scheduler\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Reason:** Conflicts detected during rebase. Manual resolution required." >> $GITHUB_STEP_SUMMARY
          fi
