name: "SAP CI/CD: Notification Service"

on:
  repository_dispatch:
    types: [sap_cicd_started, sap_cicd_finished]
  workflow_dispatch:
    inputs:
      event_type:
        description: "Event Type"
        required: true
        type: choice
        options:
          - sap_cicd_started
          - sap_cicd_finished
        default: sap_cicd_started
      status:
        description: "Status / Severity"
        required: true
        type: choice
        options:
          - INFO
          - SUCCESS
          - ERROR
          - FATAL
        default: INFO
      resource_name:
        description: "SAP CI/CD Resource / Job Name"
        required: true
        type: choice
        options:
          - "AsInt-AIS-02"
          - "AsInt-AIS-02-Safety-Test-DND"
          - "AsInt-AIS-02-mta-fix"
          - "AsInt-APM-01"
          - "AsInt-APM-EIOT"
          - "AsInt-DEMO"
          - "AsInt-IRC"
          - "AsInt-ST"
          - "BAYSTAR"
          - "Hemlock-NON-PROD"
          - "Hemlock-PROD"
          - "Indorama-PROD-900"
          - "Indorama-PROD-933"
          - "Indorama-QA-233"
          - "Indorama-QA-234"
        default: "AsInt-AIS-02"
      subject:
        description: "Subject / Description"
        required: false
        default: "Build execution triggered in SAP CI/CD"
      commit_id:
        description: "Git Commit ID (optional)"
        required: false
        default: ""
      app_name:
        description: "CF App Name (optional, defaults to repo var or mapped app)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    outputs:
      event_type: ${{ steps.process.outputs.event_type }}
      resource_name: ${{ steps.process.outputs.resource_name }}
      cf_app_name: ${{ steps.process.outputs.cf_app_name }}
    steps:
      - name: Process SAP CI/CD Event and Send MS Teams Notification
        id: process
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Determine payload inputs (from repository_dispatch or workflow_dispatch)
          echo "=== RECEIVED CLIENT PAYLOAD ==="
          echo '${{ toJson(github.event.client_payload) }}'
          echo "================================"

          EVENT_TYPE="${{ github.event.action }}"
          [ -z "$EVENT_TYPE" ] && EVENT_TYPE="${{ github.event.inputs.event_type }}"

          RESOURCE_NAME="${{ github.event.client_payload.resource_name }}"
          [ -z "$RESOURCE_NAME" ] && RESOURCE_NAME="${{ github.event.inputs.resource_name }}"
          [ -z "$RESOURCE_NAME" ] && RESOURCE_NAME="SAP CI/CD Pipeline"

          # ──────────────────────────────────────────────────────────
          # 🛡️ WHITELIST FILTER: Only process approved tenant jobs
          # ──────────────────────────────────────────────────────────
          ALLOWED_JOBS=(
            "AsInt-AIS-02"
            "AsInt-AIS-02-Safety-Test-DND"
            "AsInt-AIS-02-mta-fix"
            "AsInt-APM-01"
            "AsInt-APM-EIOT"
            "AsInt-DEMO"
            "AsInt-IRC"
            "AsInt-ST"
            "BAYSTAR"
            "Hemlock-NON-PROD"
            "Hemlock-PROD"
            "Indorama-PROD-900"
            "Indorama-PROD-933"
            "Indorama-QA-233"
            "Indorama-QA-234"
          )

          IS_ALLOWED=false
          for job in "${ALLOWED_JOBS[@]}"; do
            if [ "$RESOURCE_NAME" = "$job" ]; then
              IS_ALLOWED=true
              break
            fi
          done

          if [ "$IS_ALLOWED" != "true" ]; then
            echo "🚫 Job '$RESOURCE_NAME' is not in the allowed notification whitelist. Skipping notification."
            exit 0
          fi

          echo "event_type=$EVENT_TYPE" >> $GITHUB_OUTPUT
          echo "resource_name=$RESOURCE_NAME" >> $GITHUB_OUTPUT

          STATUS="${{ github.event.client_payload.status }}"
          [ -z "$STATUS" ] && STATUS="${{ github.event.inputs.status }}"
          [ -z "$STATUS" ] && STATUS="INFO"

          SUBJECT="${{ github.event.client_payload.subject }}"
          [ -z "$SUBJECT" ] && SUBJECT="${{ github.event.inputs.subject }}"

          BODY="${{ github.event.client_payload.body }}"
          CATEGORY="${{ github.event.client_payload.category }}"
          
          # Clean Resource Name for Display (e.g. AsInt-Indorama-Prod-900 -> Indorama Prod 900)
          CLEAN_NAME=$(echo "$RESOURCE_NAME" | sed -e 's/^AsInt-//I' -e 's/-/ /g')

          # Map Resource Name to Target Branch to determine Commit ID
          TARGET_BRANCH=""
          case "$RESOURCE_NAME" in
            "AsInt-AIS-02"|"AsInt-AIS-02-Safety-Test-DND"|"AsInt-AIS-02-mta-fix")
              TARGET_BRANCH="tenant/asint-ais-02"
              ;;
            "AsInt-APM-01")
              TARGET_BRANCH="tenant/asint-apm-01-new"
              ;;
            "AsInt-APM-EIOT")
              TARGET_BRANCH="apm-eiot-temp-copy"
              ;;
            "AsInt-DEMO")
              TARGET_BRANCH="tenant/asint-demo"
              ;;
            "AsInt-IRC")
              TARGET_BRANCH="tenant/asint-irc-temp"
              ;;
            "AsInt-ST")
              TARGET_BRANCH="st-env-for-contentfederation"
              ;;
            "BAYSTAR")
              TARGET_BRANCH="tenant/baystar"
              ;;
            "Hemlock-NON-PROD")
              TARGET_BRANCH="tenant/hemlock-non-prod"
              ;;
            "Hemlock-PROD")
              TARGET_BRANCH="tenant/hemlock-prod"
              ;;
            "Indorama-PROD-900")
              TARGET_BRANCH="tenant/indorama-prod-900"
              ;;
            "Indorama-PROD-933")
              TARGET_BRANCH="tenant/indorama-prod-933"
              ;;
            "Indorama-QA-233")
              TARGET_BRANCH="tenant/indorama-qa-233"
              ;;
            "Indorama-QA-234")
              TARGET_BRANCH="tenant/indorama-qa-234"
              ;;
          esac

          COMMIT_ID="${{ github.event.client_payload.commit_id }}"
          [ -z "$COMMIT_ID" ] && COMMIT_ID="${{ github.event.client_payload.commit }}"
          [ -z "$COMMIT_ID" ] && COMMIT_ID="${{ github.event.client_payload.sha }}"
          [ -z "$COMMIT_ID" ] && COMMIT_ID="${{ github.event.inputs.commit_id }}"

          # If commit_id is an unexpanded template placeholder, clear it
          case "$COMMIT_ID" in
            "{"*|*"}"*) COMMIT_ID="" ;;
          esac

          # Search inside tags or raw payload if commit_id is empty
          RAW_TAGS="${{ github.event.client_payload.tags }}"
          [ -z "$RAW_TAGS" ] && RAW_TAGS='${{ toJson(github.event.client_payload) }}'
          if [ -z "$COMMIT_ID" ]; then
            TAG_COMMIT=$(echo "$RAW_TAGS" | grep -oE '(commitish|commit|sha)[=:][" ]?[a-f0-9]+' | grep -oE '[a-f0-9]{7,40}' | head -n 1)
            [ -n "$TAG_COMMIT" ] && COMMIT_ID="$TAG_COMMIT"
          fi

          # Shorten to 7 characters if a valid commit hash was received
          if echo "$COMMIT_ID" | grep -qE '^[a-f0-9]{7,40}$'; then
            COMMIT_ID=$(echo "$COMMIT_ID" | cut -c 1-7)
          else
            COMMIT_ID=""
          fi

          if [ -z "$COMMIT_ID" ] && [ -n "$TARGET_BRANCH" ]; then
            COMMIT_ID=$(gh api repos/${{ github.repository }}/commits/$TARGET_BRANCH --jq '.sha' 2>/dev/null | cut -c 1-7)
          fi
          [ -z "$COMMIT_ID" ] && COMMIT_ID="N/A"

          DASHBOARD_URL="https://asint-payg-development.cicd.cfapps.eu10.hana.ondemand.com/ui/index.html#"
          TIMESTAMP=$(TZ='Asia/Kolkata' date +"%Y-%m-%d %I:%M %p IST")

          # 2. Configure Card Header, Color, and Subtitle based on Event Type
          if [ "$EVENT_TYPE" = "sap_cicd_started" ]; then
            CARD_TITLE="🟡 SAP CI/CD Pipeline Started"
            CARD_COLOR="warning"
            STATUS_BADGE="⏳ Running Build & Deployment"
            CARD_SUBTITLE="Build execution is now in progress for $CLEAN_NAME."
          elif [ "$STATUS" = "SUCCESS" ] || [ "$STATUS" = "INFO" ]; then
            CARD_TITLE="✅ SAP CI/CD Deployment Succeeded"
            CARD_COLOR="good"
            STATUS_BADGE="🚀 Deployed Successfully"
            CARD_SUBTITLE="Pipeline build and deployment completed without errors."
          else
            CARD_TITLE="❌ SAP CI/CD Deployment Failed"
            CARD_COLOR="attention"
            STATUS_BADGE="⚠️ Build / Deployment Failed"
            CARD_SUBTITLE="Pipeline execution encountered an error. Please inspect logs."
          fi

          [ -n "$SUBJECT" ] && [ "$SUBJECT" != "null" ] && CARD_SUBTITLE="$SUBJECT"

          CF_APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          if [ -z "$CF_APP_NAME" ]; then
            case "$RESOURCE_NAME" in
              "AsInt-AIS-02")
                CF_APP_NAME="${{ vars.CF_APP_AIS02 || 'crawler-layer-backend' }}"
                ;;
              "AsInt-APM-01")
                CF_APP_NAME="${{ vars.CF_APP_APM01 || 'crawler-layer-backend' }}"
                ;;
            esac
          fi
          echo "cf_app_name=$CF_APP_NAME" >> $GITHUB_OUTPUT

          CF_APP_STATUS=""
          if [ -n "$CF_APP_NAME" ]; then
            if [ "$EVENT_TYPE" = "sap_cicd_started" ]; then
              CF_APP_STATUS="🛑 $CF_APP_NAME stopped (needed more CF runtime memory to get deployment completed)"
            elif [ "$EVENT_TYPE" = "sap_cicd_finished" ]; then
              CF_APP_STATUS="▶️ Restarting $CF_APP_NAME to restore runtime services..."
            fi
          fi

          # 3. Check for configured MS Teams Webhook URLs
          if [ -z "${{ secrets.TEAMS_WEBHOOK_URL_AIS02 }}" ] && [ -z "${{ secrets.TEAMS_WEBHOOK_URL }}" ] && [ -z "${{ secrets.TEAMS_WEBHOOK_URL_2 }}" ] && [ -z "${{ secrets.TEAMS_WEBHOOK_URL_3 }}" ]; then
            echo "No Teams webhook secrets configured. Skipping notification."
            exit 0
          fi

          # 4. Construct MS Teams Adaptive Card Payload
          PAYLOAD=$(jq -n \
            --arg title "$CARD_TITLE" \
            --arg color "$CARD_COLOR" \
            --arg subtitle "$CARD_SUBTITLE" \
            --arg status "$STATUS_BADGE" \
            --arg job "$RESOURCE_NAME" \
            --arg env_name "$CLEAN_NAME" \
            --arg commit_id "$COMMIT_ID" \
            --arg time "$TIMESTAMP" \
            --arg dashboard "$DASHBOARD_URL" \
            --arg cf_app_status "$CF_APP_STATUS" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  body: [
                    {
                      type: "TextBlock",
                      size: "Large",
                      weight: "Bolder",
                      text: $title,
                      wrap: true
                    },
                    {
                      type: "TextBlock",
                      text: $subtitle,
                      size: "Small",
                      isSubtle: true,
                      wrap: true
                    },
                    {
                      type: "ColumnSet",
                      columns: [
                        {
                          type: "Column",
                          width: "auto",
                          items: [{
                            type: "TextBlock",
                            text: $status,
                            weight: "Bolder",
                            color: $color
                          }]
                        }
                      ]
                    },
                    {
                      type: "FactSet",
                      facts: (
                        [
                          { title: "Environment", value: $env_name },
                          { title: "SAP CI/CD Job", value: $job },
                          { title: "CI/CD Commit ID", value: $commit_id },
                          { title: "Timestamp", value: $time }
                        ] +
                        (if $cf_app_status != "" then [
                          { title: "CF App Status", value: $cf_app_status }
                        ] else [] end)
                      )
                    }
                  ],
                  actions: [
                    {
                      type: "Action.OpenUrl",
                      title: "Open SAP CI/CD Dashboard",
                      url: $dashboard
                    }
                  ]
                }
              }]
            }')

          # 5. Broadcast to all configured Teams Webhooks
          for WEBHOOK_URL in \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_2 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_3 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_2 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_3 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_4 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_5 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_6 }}"; do
            if [ -n "$WEBHOOK_URL" ]; then
              curl -s -X POST \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" \
                "$WEBHOOK_URL"
            fi
          done

  # ──────────────────────────────────────────────────────────
  # 🚀 POST-DEPLOY: Automatically Restart crawler-layer-backend
  # Triggered when AIS-02 or APM-01 build finishes (Success OR Failure)
  # ──────────────────────────────────────────────────────────
  post-restart-ais02:
    needs: notify
    if: always() && needs.notify.outputs.event_type == 'sap_cicd_finished' && needs.notify.outputs.resource_name == 'AsInt-AIS-02' && needs.notify.outputs.cf_app_name != ''
    uses: ./.github/workflows/_cf_app_control.yml
    with:
      api_endpoint: "https://api.cf.eu10-004.hana.ondemand.com"
      org: "ais-02-eu10-org"
      space: "main"
      app_name: ${{ needs.notify.outputs.cf_app_name }}
      action: "start"
    secrets: inherit

  notify-restart-ais02:
    needs: [notify, post-restart-ais02]
    if: always() && needs.post-restart-ais02.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Send AIS-02 App Restarted Teams Card
        env:
          APP_NAME: ${{ needs.notify.outputs.cf_app_name || 'crawler-layer-backend' }}
        run: |
          TIMESTAMP=$(TZ='Asia/Kolkata' date +"%Y-%m-%d %I:%M %p IST")
          PAYLOAD=$(jq -n \
            --arg title "🟢 AIS-02: $APP_NAME Restarted Successfully" \
            --arg subtitle "Post-deployment automation has restarted $APP_NAME in Cloud Foundry (main space)." \
            --arg status "🟢 Running • Services Restored" \
            --arg app "$APP_NAME" \
            --arg time "$TIMESTAMP" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  body: [
                    {
                      type: "TextBlock",
                      size: "Large",
                      weight: "Bolder",
                      text: $title,
                      wrap: true
                    },
                    {
                      type: "TextBlock",
                      text: $subtitle,
                      size: "Medium",
                      wrap: true,
                      color: "Good"
                    },
                    {
                      type: "ColumnSet",
                      columns: [
                        {
                          type: "Column",
                          width: "auto",
                          items: [{
                            type: "TextBlock",
                            text: $status,
                            weight: "Bolder",
                            color: "Good"
                          }]
                        }
                      ]
                    },
                    {
                      type: "FactSet",
                      facts: [
                        { title: "Environment", value: "AIS-02" },
                        { title: "App Name", value: $app },
                        { title: "CF Space", value: "main" },
                        { title: "State", value: "▶️ Running" },
                        { title: "Timestamp", value: $time }
                      ]
                    }
                  ]
                }
              }]
            }')

          for WEBHOOK_URL in \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_2 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_3 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_2 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_3 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_4 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_5 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_6 }}"; do
            if [ -n "$WEBHOOK_URL" ]; then
              curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL" || true
            fi
          done

  post-restart-apm01:
    needs: notify
    if: always() && needs.notify.outputs.event_type == 'sap_cicd_finished' && needs.notify.outputs.resource_name == 'AsInt-APM-01' && needs.notify.outputs.cf_app_name != ''
    uses: ./.github/workflows/_cf_app_control.yml
    with:
      api_endpoint: "https://api.cf.eu10-004.hana.ondemand.com"
      org: "asint-apm-01"
      space: "demo"
      app_name: ${{ needs.notify.outputs.cf_app_name }}
      action: "start"
    secrets: inherit

  notify-restart-apm01:
    needs: [notify, post-restart-apm01]
    if: always() && needs.post-restart-apm01.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Send APM-01 App Restarted Teams Card
        env:
          APP_NAME: ${{ needs.notify.outputs.cf_app_name || 'crawler-layer-backend' }}
        run: |
          TIMESTAMP=$(TZ='Asia/Kolkata' date +"%Y-%m-%d %I:%M %p IST")
          PAYLOAD=$(jq -n \
            --arg title "🟢 APM-01: $APP_NAME Restarted Successfully" \
            --arg subtitle "Post-deployment automation has restarted $APP_NAME in Cloud Foundry (demo space)." \
            --arg status "🟢 Running • Services Restored" \
            --arg app "$APP_NAME" \
            --arg time "$TIMESTAMP" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.4",
                  body: [
                    {
                      type: "TextBlock",
                      size: "Large",
                      weight: "Bolder",
                      text: $title,
                      wrap: true
                    },
                    {
                      type: "TextBlock",
                      text: $subtitle,
                      size: "Medium",
                      wrap: true,
                      color: "Good"
                    },
                    {
                      type: "ColumnSet",
                      columns: [
                        {
                          type: "Column",
                          width: "auto",
                          items: [{
                            type: "TextBlock",
                            text: $status,
                            weight: "Bolder",
                            color: "Good"
                          }]
                        }
                      ]
                    },
                    {
                      type: "FactSet",
                      facts: [
                        { title: "Environment", value: "APM-01" },
                        { title: "App Name", value: $app },
                        { title: "CF Space", value: "demo" },
                        { title: "State", value: "▶️ Running" },
                        { title: "Timestamp", value: $time }
                      ]
                    }
                  ]
                }
              }]
            }')

          for WEBHOOK_URL in \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_2 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_3 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_2 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_3 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_4 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_5 }}" \
            "${{ secrets.TEAMS_WEBHOOK_URL_AIS02_6 }}"; do
            if [ -n "$WEBHOOK_URL" ]; then
              curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL" || true
            fi
          done
