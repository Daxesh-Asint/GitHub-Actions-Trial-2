      # ──────────────────────────────────────────────────────────
      # 🔁 Auto-Detect SAP CI/CD Dashboard Re-Trigger (APM-02 Family)
      # ──────────────────────────────────────────────────────────
      - name: Auto-Detect SAP CI/CD Dashboard Re-Trigger and Resume Tracking
        if: steps.process.outputs.event_type == 'sap_cicd_started'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          RESOURCE_NAME: ${{ steps.process.outputs.resource_name }}
        run: |
          LABEL_PREFIX=""
          BASE_BRANCH=""

          if echo "$RESOURCE_NAME" | grep -qi "AsInt-APM-02-DC-AddIn"; then
            LABEL_PREFIX="APM-02 DC AddIn"
            BASE_BRANCH="main-dc-addin"
          elif echo "$RESOURCE_NAME" | grep -qi "AsInt-APM-02-DC"; then
            LABEL_PREFIX="APM-02 DC"
            BASE_BRANCH="main-dc"
          elif echo "$RESOURCE_NAME" | grep -qi "AsInt-APM-02"; then
            LABEL_PREFIX="APM-02"
            BASE_BRANCH="main"
          fi

          if [ -n "$LABEL_PREFIX" ]; then
            echo "🔍 Checking for open tracking PR in '${LABEL_PREFIX} Blocked' or '${LABEL_PREFIX} Failed' state..."
            TARGET_PR=$(gh pr list --repo ${{ github.repository }} --state open --limit 500 --json number,headRefName,labels \
              --jq "[.[] | select(.labels[].name | test(\"^${LABEL_PREFIX} (Blocked|Failed|Pre-Deploy Blocked)\"))][0]")

            PR_NUMBER=$(echo "$TARGET_PR" | jq -r '.number // empty')
            SNAPSHOT=$(echo "$TARGET_PR" | jq -r '.headRefName // empty')

            if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
              echo "🔁 Detected SAP CI/CD Dashboard re-trigger for PR #$PR_NUMBER ($SNAPSHOT)!"

              # Collect all existing labels matching this prefix to cleanly remove them (preventing dual or stuck labels)
              REMOVE_ARGS=()
              while IFS= read -r lbl; do
                if [ -n "$lbl" ] && [ "$lbl" != "${LABEL_PREFIX} Deploying" ]; then
                  REMOVE_ARGS+=(--remove-label "$lbl")
                fi
              done < <(echo "$TARGET_PR" | jq -r --arg prefix "$LABEL_PREFIX" '.labels[].name | select(startswith($prefix))')

              # Update Tracking PR: set Deploying title, remove old labels, and apply single Deploying label
              gh pr edit "$PR_NUMBER" --repo ${{ github.repository }} \
                --title "🟡 ${LABEL_PREFIX} Deploying: Merging from ${SNAPSHOT} to ${BASE_BRANCH}" \
                "${REMOVE_ARGS[@]}" \
                --add-label "${LABEL_PREFIX} Deploying"

              gh pr comment "$PR_NUMBER" --repo ${{ github.repository }} \
                --body "🔁 **SAP CI/CD Dashboard Re-Trigger Detected:** A new build was triggered directly from the SAP CI/CD portal for \`$RESOURCE_NAME\`. Tracking state transitioned to \`${LABEL_PREFIX} Deploying\` (all previous Blocked/Failed status labels cleared). Automatic monitoring and sync to \`${BASE_BRANCH}\` resumed."

              echo "✅ Successfully transitioned Tracking PR #$PR_NUMBER to '${LABEL_PREFIX} Deploying' (clean single label)."
            else
              echo "ℹ️ No open tracking PR currently in '${LABEL_PREFIX} Blocked' or '${LABEL_PREFIX} Failed' state."
            fi
          fi

      # ──────────────────────────────────────────────────────────
      # 📖 Global Wiki Deployment History Update
      # ──────────────────────────────────────────────────────────
      - name: Checkout Wiki
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}

      - name: Setup Node.js for Wiki
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update Global Wiki Deployment History (SAP Event)
        if: always()
        run: |
          if [ -d "wiki" ] && [ -n "${{ steps.process.outputs.resource_name }}" ]; then
            EVENT_ACT="${{ steps.process.outputs.event_type }}"
            WIKI_ACT="sap_finish"
            if [ "$EVENT_ACT" = "sap_cicd_started" ]; then
              WIKI_ACT="sap_start"
            fi

            export WIKI_PAYLOAD=$(jq -n \
              --arg env "${{ steps.process.outputs.clean_name || steps.process.outputs.resource_name }}" \
              --arg action "$WIKI_ACT" \
              --arg commit "${{ steps.process.outputs.commit_id }}" \
              --arg status "${{ steps.process.outputs.status }}" \
              '{
                environment: $env,
                action: $action,
                commit_id: $commit,
                status: $status
              }')

            node .github/scripts/update_wiki_global.js || echo "Global wiki update warning: script finished with error"
          else
            echo "Skipping wiki update: Wiki dir or resource_name not available."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN || github.token }}

