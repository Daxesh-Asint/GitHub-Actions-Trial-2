name: "[Test] Simulate SAP Webhook"

on:
  workflow_dispatch:
    inputs:
      event_type:
        description: "Event Type to Simulate"
        required: true
        type: choice
        options:
          - sap_cicd_started
          - sap_cicd_finished
        default: sap_cicd_started
      status:
        description: "Status (Used when finished)"
        required: true
        type: choice
        options:
          - INFO
          - SUCCESS
          - ERROR
        default: SUCCESS
      resource_name:
        description: "SAP CI/CD Resource Name"
        required: true
        type: choice
        options:
          - "AsInt-AIS-02"
          - "AsInt-AIS-02-mta-fix"
          - "AsInt-APM-01"
          - "AsInt-APM-EIOT"
          - "AsInt-DEMO"
          - "AsInt-IRC"
          - "AsInt-ST"
          - "BAYSTAR"
          - "Hemlock-NON-PROD"
          - "Hemlock-PROD"
          - "Indorama-PROD-900"
          - "Indorama-PROD-933"
          - "Indorama-QA-233"
          - "Indorama-QA-234"
        default: "AsInt-Indorama-Prod-900"

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SAP CI/CD Webhook
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Simulating SAP CI/CD event: ${{ inputs.event_type }} for ${{ inputs.resource_name }}"
          gh api repos/${{ github.repository }}/dispatches \
            -X POST \
            -f event_type="${{ inputs.event_type }}" \
            -F client_payload[status]="${{ inputs.status }}" \
            -F client_payload[resource_name]="${{ inputs.resource_name }}" \
            -F client_payload[subject]="Simulated ${{ inputs.event_type }} for ${{ inputs.resource_name }}"
          echo "✅ Webhook successfully sent!"
