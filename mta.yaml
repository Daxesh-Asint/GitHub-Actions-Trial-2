#########################################################################################
###################                 Managed Approuter                 ##################

# - Please adjusted the disk-quota & memory accordingly to the CF-Space
# - Maintain the xs-security-managed-approuter.json content in xs-security.json
# - If the sub-account doesn't have APM service, please create it (asint-apm-instance) as user-provided service and configure it under resources

#########################################################################################

_schema-version: "3.2"
ID: asint-ais
version: 0.0.1
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - echo "Building UI modules"
        - npm run build-ui
        - echo "CDS Build for analytics-backend (nodeJS)"
        - cp .cdsrc-nodejs.json .cdsrc.json
        - cds build --for nodejs
        - echo "CDS Build for hana"
        - cp .cdsrc-java.json .cdsrc.json
        - cds build --for hana

modules:
  - name: asint-ais-destination-content
    type: com.sap.application.content
    requires:
      - name: asint-ais-backend-api
      - name: asint_ais_event_layer-api
      - name: asint-ais-analytics-backend-api
      - name: asint-ais-destination
        parameters:
          content-target: true
      # --- Asset Integrity ---
      - name: asint-ais-html_repo_host-integrity-1
        parameters:
          service-key:
            name: asint-ais-html_repo_host-integrity-1-key
      - name: asint-ais-html_repo_host-integrity-2
        parameters:
          service-key:
            name: asint-ais-html_repo_host-integrity-2-key
      # --- Asset Risk and Reliability Suite ---
      - name: asint-ais-html_repo_host-reliability-1
        parameters:
          service-key:
            name: asint-ais-html_repo_host-reliability-1-key
      - name: asint-ais-html_repo_host-reliability-2
        parameters:
          service-key:
            name: asint-ais-html_repo_host-reliability-2-key
      # --- Default ---
      - name: asint-ais-html_repo_host-default-1
        parameters:
          service-key:
            name: asint-ais-html_repo_host-default-1-key
      - name: asint-ais-html_repo_host-default-2
        parameters:
          service-key:
            name: asint-ais-html_repo_host-default-2-key
      - name: asint-ais-html_repo_host-default-3
        parameters:
          service-key:
            name: asint-ais-html_repo_host-default-3-key
      # --- Master Data ---
      - name: asint-ais-html_repo_host-masterdata-1
        parameters:
          service-key:
            name: asint-ais-html_repo_host-masterdata-1-key
      # --- Planning ---
      - name: asint-ais-html_repo_host-planning-1
        parameters:
          service-key:
            name: asint-ais-html_repo_host-planning-1-key
      - name: asint-ais-html_repo_host-planning-2
        parameters:
          service-key:
            name: asint-ais-html_repo_host-planning-2-key
      # --- Safety Suite (Functional Safety + Functions & Barriers + Process Safety) ---
      - name: asint-ais-html_repo_host-safety-1
        parameters:
          service-key:
            name: asint-ais-html_repo_host-safety-1-key
      - name: asint-ais-html_repo_host-safety-2
        parameters:
          service-key:
            name: asint-ais-html_repo_host-safety-2-key
      - name: asint-ais-xsuaa_service
        parameters:
          service-key:
            name: asint-ais-xsuaa_service-key
      - name: asint-ais-feature_flag
        parameters:
          service-key:
            name: asint-ais-feature_flag-key
    parameters:
      content:
        instance:
          destinations:
            - Authentication: OAuth2UserTokenExchange
              Name: asint-ais-backend-api
              TokenServiceInstanceName: asint-ais-xsuaa_service
              TokenServiceKeyName: asint-ais-xsuaa_service-key
              URL: ~{asint-ais-backend-api/url}
              HTML5.Timeout: 300000
            - Authentication: OAuth2UserTokenExchange
              Name: asint_ais_event_layer-api
              TokenServiceInstanceName: asint-ais-xsuaa_service
              TokenServiceKeyName: asint-ais-xsuaa_service-key
              URL: ~{asint_ais_event_layer-api/url}
              HTML5.Timeout: 300000
            - Authentication: OAuth2UserTokenExchange
              Name: asint-ais-analytics-backend-api
              TokenServiceInstanceName: asint-ais-xsuaa_service
              TokenServiceKeyName: asint-ais-xsuaa_service-key
              URL: ~{asint-ais-analytics-backend-api/url}
              HTML5.Timeout: 300000
            # --- Asset Integrity ---
            - Name: asint-ais-html_repo_host-integrity-1
              ServiceInstanceName: asint-ais-html_repo_host-integrity-1
              ServiceKeyName: asint-ais-html_repo_host-integrity-1-key
              sap.cloud.service: asint.ais
            - Name: asint-ais-html_repo_host-integrity-2
              ServiceInstanceName: asint-ais-html_repo_host-integrity-2
              ServiceKeyName: asint-ais-html_repo_host-integrity-2-key
              sap.cloud.service: asint.ais
            # --- Asset Risk and Reliability Suite ---
            - Name: asint-ais-html_repo_host-reliability-1
              ServiceInstanceName: asint-ais-html_repo_host-reliability-1
              ServiceKeyName: asint-ais-html_repo_host-reliability-1-key
              sap.cloud.service: asint.ais
            - Name: asint-ais-html_repo_host-reliability-2
              ServiceInstanceName: asint-ais-html_repo_host-reliability-2
              ServiceKeyName: asint-ais-html_repo_host-reliability-2-key
              sap.cloud.service: asint.ais
            # --- Default ---
            - Name: asint-ais-html_repo_host-default-1
              ServiceInstanceName: asint-ais-html_repo_host-default-1
              ServiceKeyName: asint-ais-html_repo_host-default-1-key
              sap.cloud.service: asint.ais
            - Name: asint-ais-html_repo_host-default-2
              ServiceInstanceName: asint-ais-html_repo_host-default-2
              ServiceKeyName: asint-ais-html_repo_host-default-2-key
              sap.cloud.service: asint.ais
            - Name: asint-ais-html_repo_host-default-3
              ServiceInstanceName: asint-ais-html_repo_host-default-3
              ServiceKeyName: asint-ais-html_repo_host-default-3-key
              sap.cloud.service: asint.ais
            # --- Master Data ---
            - Name: asint-ais-html_repo_host-masterdata-1
              ServiceInstanceName: asint-ais-html_repo_host-masterdata-1
              ServiceKeyName: asint-ais-html_repo_host-masterdata-1-key
              sap.cloud.service: asint.ais
            # --- Planning ---
            - Name: asint-ais-html_repo_host-planning-1
              ServiceInstanceName: asint-ais-html_repo_host-planning-1
              ServiceKeyName: asint-ais-html_repo_host-planning-1-key
              sap.cloud.service: asint.ais
            - Name: asint-ais-html_repo_host-planning-2
              ServiceInstanceName: asint-ais-html_repo_host-planning-2
              ServiceKeyName: asint-ais-html_repo_host-planning-2-key
              sap.cloud.service: asint.ais
            # --- Safety Suite ---
            - Name: asint-ais-html_repo_host-safety-1
              ServiceInstanceName: asint-ais-html_repo_host-safety-1
              ServiceKeyName: asint-ais-html_repo_host-safety-1-key
              sap.cloud.service: asint.ais
            - Name: asint-ais-html_repo_host-safety-2
              ServiceInstanceName: asint-ais-html_repo_host-safety-2
              ServiceKeyName: asint-ais-html_repo_host-safety-2-key
              sap.cloud.service: asint.ais
            - Authentication: OAuth2UserTokenExchange
              Name: asint-ais-xsuaa_service
              ServiceInstanceName: asint-ais-xsuaa_service
              ServiceKeyName: asint-ais-xsuaa_service-key
              sap.cloud.service: asint.ais
            - Name: asint-ais-feature_flag
              ServiceInstanceName: asint-ais-feature_flag
              ServiceKeyName: asint-ais-feature_flag-key
          existing_destinations_policy: update
    build-parameters:
      no-source: true

  # ============================================================
  # ASSET INTEGRITY GROUP (hosts: integrity-1, integrity-2, integrity-3)
  # ============================================================

  - name: asint-ais-app-content-integrity-1
    type: com.sap.application.content
    path: .
    requires:
      - name: asint-ais-html_repo_host-integrity-1
        parameters:
          content-target: true
    build-parameters:
      build-result: resources-integrity-1
      requires:
        - artifacts:
            - comasintaismicloneapp.zip
          name: asint-ais-cloneapp
          target-path: resources-integrity-1/
        - artifacts:
            - comasintaismiidms.zip
          name: asint-ais-idms
          target-path: resources-integrity-1/
        - artifacts:
            - comasintaismiassetstrategydevelopment.zip
          name: asint-ais-asset-strategy-development
          target-path: resources-integrity-1/
        - artifacts:
            - comasintaismicml.zip
          name: asint-ais-cml
          target-path: resources-integrity-1/

  - name: asint-ais-app-content-integrity-2
    type: com.sap.application.content
    path: .
    requires:
