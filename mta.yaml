          name: asint-ais-process-monitor
          target-path: resources-default-3/
        - artifacts:
            - comasintworkflowbuilder.zip
          name: asint-ais-workflow-builder
          target-path: resources-default-3/
        - artifacts:
            - comasintaismiconfigmatrix.zip
          name: asint-ais-configuration-matrix
          target-path: resources-default-3/
        - artifacts:
            - comasintaismiconfig.zip
          name: asint-ais-configurations
          target-path: resources-default-3/
        - artifacts:
            - comasintaismireplicator.zip
          name: asint-ais-content-replicator
          target-path: resources-default-3/

  # ============================================================
  # MASTER DATA GROUP (hosts: masterdata-1)
  # ============================================================

  - name: asint-ais-app-content-masterdata-1
    type: com.sap.application.content
    path: .
    requires:
      - name: asint-ais-html_repo_host-masterdata-1
        parameters:
          content-target: true
    build-parameters:
      build-result: resources-masterdata-1
      requires:
