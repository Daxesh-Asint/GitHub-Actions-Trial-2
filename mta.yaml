          target-path: resources-safety-2/
        - artifacts:
            - comasintaissslopa.zip
          name: asint-ais-lopa
          target-path: resources-safety-2/

  - name: asint-ais-fiori_tile_1x1
    type: html5
    path: asint_ais_fiori_tile_1x1
    build-parameters:
      build-result: dist
      builder: custom
      commands: []
      supported-platforms: []

  - name: asint-ais-flp_plugin
    type: html5
    path: asint_ais_flp_plugin
    build-parameters:
      build-result: dist
      builder: custom
      commands: []
      supported-platforms: []

  - name: asint-ais-schema-deployer
    type: hdb
    path: asint_ais_model/src/gen
    parameters:
      memory: 1280M
      buildpack: nodejs_buildpack
      tasks:
        - name: deploy
          memory: 1280M 
          command: npm start
    requires:
      - name: asint-hana-key-service

  - name: asint-ais-backend
    type: java
    path: asint_ais_backend
    parameters:
      memory: 1536M
      stack: cflinuxfs4
      buildpack: sap_java_buildpack_jakarta
      health-check-type: port
      health-check-timeout: 120
    properties:
      SPRING_PROFILES_ACTIVE: cloud
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 17.+ }'
    requires:
      - name: asint-ais-xsuaa_service
      - name: asint-hana-key-service
      - name: asint-apm-instance
      - name: asint-ais-connectivity
      - name: asint-ais-destination
      - name: asint_ais_scaler
        parameters:
          path: ./autoscaler.json
      - name: asint-ais-logger
    provides:
      - name: asint-ais-backend-api
        properties:
          url: ${default-url}
    build-parameters:
      build-result: "target/*.jar"
      timeout: 30m
    deployed-after: [ asint-ais-schema-deployer ]

  - name: asint_ais_event_layer
    type: java
    path: asint_ais_event_layer
    parameters:
      memory: 1024M
      stack: cflinuxfs4
      buildpack: sap_java_buildpack_jakarta
      health-check-type: port
      health-check-timeout: 120
    properties:
      SPRING_PROFILES_ACTIVE: cloud
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 17.+ }'
    requires:
      - name: asint-apm-instance
      - name: asint-hana-key-service
      - name: asint-ais-xsuaa_apiaccess
      - name: asint-ais-xsuaa_service
      - name: asint-ais-connectivity
      - name: asint-ais-destination
      - name: asint-ais-logger
      - name: asint-ais-event_mesh
    provides:
      - name: asint_ais_event_layer-api
        properties:
          url: ${default-url}
    build-parameters:
      build-result: "target/*.jar"
    deployed-after: [ asint-ais-schema-deployer ]

  - name: asint-ais-analytics-backend
    type: nodejs
    path: asint_ais_analytics_backend/gen
    parameters:
      memory: 512M
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    requires:
      - name: asint-ais-xsuaa_service
      - name: asint-hana-key-service
      - name: asint-apm-instance
      - name: asint-ais-connectivity
      - name: asint-ais-destination
      - name: asint-ais-logger
    provides:
      - name: asint-ais-analytics-backend-api
        properties:
          url: ${default-url}
    build-parameters:
      builder: npm
    deployed-after: [ asint-ais-schema-deployer ]

  - name: asint-ais-library
    type: html5
    path: asint_ais_library
    build-parameters:
      build-result: dist
      builder: custom
      commands: []
      supported-platforms: []

  - name: asint-ais-equipment
