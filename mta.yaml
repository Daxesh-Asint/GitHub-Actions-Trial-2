resources:
  - name: asint-ais-destination
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-plan: lite

  - name: asint-ais-xsuaa_service
    type: org.cloudfoundry.managed-service
    parameters:
      path: ./xs-security.json
      service: xsuaa
      service-plan: application

  # --- Asset Integrity ---
  - name: asint-ais-html_repo_host-integrity-1
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: asint-ais-html_repo_host-integrity-2
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # --- Asset Risk and Reliability Suite ---
  - name: asint-ais-html_repo_host-reliability-1
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: asint-ais-html_repo_host-reliability-2
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # --- Default ---
  - name: asint-ais-html_repo_host-default-1
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: asint-ais-html_repo_host-default-2
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: asint-ais-html_repo_host-default-3
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # --- Master Data ---
  - name: asint-ais-html_repo_host-masterdata-1
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # --- Planning ---
  - name: asint-ais-html_repo_host-planning-1
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: asint-ais-html_repo_host-planning-2
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # --- Safety Suite (Functional Safety + Functions & Barriers + Process Safety) ---
  - name: asint-ais-html_repo_host-safety-1
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: asint-ais-html_repo_host-safety-2
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: asint-hana-key-service
    type: org.cloudfoundry.user-provided-service
    parameters:
      service: user-provided
      service-tags: ["hana","relational", "database"]

  - name: asint-apm-instance
    type: org.cloudfoundry.managed-service
    parameters:
      service: apm
      service-plan: standard

  - name: asint_ais_scaler
    type: org.cloudfoundry.managed-service
    parameters:
      service: autoscaler
      service-plan: standard
  
  - name: asint-ais-xsuaa_apiaccess
    type: org.cloudfoundry.existing-service

  - name: asint-ais-logger
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite

  - name: asint-ais-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: asint-ais-event_mesh
    type: org.cloudfoundry.existing-service

  - name: asint-ais-feature_flag
    type: org.cloudfoundry.managed-service
    parameters:
      service: feature-flags
      service-plan: standard

